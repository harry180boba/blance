<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#6C4FE0">
<title>記帳 · MoneyBook</title>
<style>
:root{
  --bg:#EEF0F5; --surface:#FFFFFF; --surface-2:#F6F7FB;
  --ink:#13151B; --ink-2:#4B5462; --ink-3:#8A93A3; --line:#E3E6EE;
  --brand:#6C4FE0; --brand-ink:#4B30C7;
  --expense:#F0445B; --income:#13B47A; --transfer:#2E8FF0; --adjust:#F59E0B;
  --shadow:0 8px 24px rgba(22,26,40,.10);
  --shadow-sm:0 2px 8px rgba(22,26,40,.07);
  --r:18px; --r-sm:12px;
  --navh:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-weight:500;-webkit-font-smoothing:antialiased;letter-spacing:.1px}
body{overscroll-behavior-y:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-weight:600;color:var(--ink)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;
  background:var(--bg);position:relative;display:flex;flex-direction:column}

/* ---------- Header ---------- */
.appbar{position:sticky;top:0;z-index:30;background:var(--bg);
  padding:max(12px,env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:8px}
.appbar h1{font-size:21px;font-weight:800;margin:0;letter-spacing:.4px}
.appbar .sub{font-size:12.5px;color:var(--ink-3);font-weight:700;margin-left:auto;white-space:nowrap}
.ab-title{flex:1;display:flex;flex-direction:column;align-items:flex-start;line-height:1.18;text-align:left}
.ab-title b{font-size:19px;font-weight:900}
.ab-title i{font-size:11px;font-style:normal;font-weight:800;color:var(--brand)}

/* ---------- View ---------- */
#view{flex:1;padding:4px 16px calc(var(--navh) + env(safe-area-inset-bottom) + 28px)}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-sm);padding:16px;margin-bottom:14px}
.card.tight{padding:0;overflow:hidden}
.h-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.h-row h2{font-size:16px;font-weight:800;margin:0}
.muted{color:var(--ink-3);font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);
  border-radius:999px;padding:7px 13px;font-size:13px;font-weight:800;color:var(--ink-2)}
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:2px}
.seg button{flex:1;border-radius:999px;padding:7px 4px;font-size:13px;font-weight:800;color:var(--ink-3)}
.seg button.on{background:var(--surface);color:var(--brand-ink);box-shadow:var(--shadow-sm)}

.big-amt{font-size:34px;font-weight:900;letter-spacing:.5px;line-height:1.1}
.add-btn{background:var(--brand);color:#fff;font-weight:800;border-radius:999px;
  padding:9px 16px;font-size:14px;box-shadow:0 6px 16px rgba(108,79,224,.35);display:inline-flex;gap:6px;align-items:center}
.icon-btn{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:17px;font-weight:800;color:var(--ink-2)}

.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.grp-label{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 5px;font-size:11.5px;font-weight:800;color:var(--ink-3);background:var(--surface-2)}
.grp-label span:first-child{letter-spacing:.3px}
.av{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:20px;flex:none;color:#fff}
.row .nm{font-weight:800;font-size:15px}
.row .sub{font-size:12px;color:var(--ink-3);font-weight:700;margin-top:1px}
.row .amt{margin-left:auto;font-weight:900;font-size:16px;text-align:right}
.amt.pos{color:var(--income)} .amt.neg{color:var(--expense)} .amt.tr{color:var(--transfer)}

.empty{text-align:center;color:var(--ink-3);font-weight:700;padding:30px 10px;font-size:14px}
.empty .ico{font-size:32px;margin-bottom:8px}

.bar{height:9px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.bar > i{display:block;height:100%;border-radius:999px;transition:width .4s}

/* ---------- Bottom nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:480px;margin:0 auto;
  background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);
  height:calc(var(--navh) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-3);font-size:11px;font-weight:800}
.nav button.on{color:var(--brand)}
.nav .ic{font-size:21px;line-height:1}
.nav .fab{position:relative;top:-12px;width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,#7d5ff0,#6C4FE0);color:#fff;display:grid;place-items:center;
  font-size:30px;font-weight:300;box-shadow:0 10px 22px rgba(108,79,224,.5);margin:0 auto}
.nav .fab-label{position:absolute;bottom:6px;font-size:11px;font-weight:800;color:var(--brand)}

/* ---------- Sheet / modal ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(15,18,30,.45);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:480px;margin:0 auto;
  background:var(--surface);border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);
  transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);
  max-height:92vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet.show{transform:translateY(0)}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 4px}
.sheet .sh-head{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 10px;gap:10px}
.sheet .sh-head h3{margin:0;font-size:17px;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-head-right{display:flex;align-items:center;gap:8px;flex:none}
.sheet-action{font-weight:800;font-size:14px;color:#fff;background:var(--brand);border-radius:999px;padding:8px 16px;box-shadow:0 4px 12px rgba(108,79,224,.32);white-space:nowrap}
.sheet-action:active{transform:scale(.96)}
.sheet .sh-body{overflow-y:auto;overflow-x:hidden;padding:0 18px 18px}
.date-sep{position:sticky;top:0;z-index:2;background:var(--surface);font-size:11.5px;font-weight:800;color:var(--ink-3);padding:8px 2px 4px;margin-bottom:4px}

label.fld{display:block;margin:14px 0 0}
.fld{margin:14px 0 0}
label.fld .lb,.fld .lb{font-size:12.5px;font-weight:800;color:var(--ink-3);margin-bottom:6px;display:block}
.input{width:100%;background:var(--surface-2);border:2px solid transparent;border-radius:13px;padding:13px 14px;font-size:15px;font-weight:700;outline:none}
.input:focus{border-color:var(--brand);background:#fff}
textarea.input{resize:none;min-height:46px}

.type-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.type-seg button{padding:12px 4px;border-radius:13px;font-weight:800;font-size:14px;background:var(--surface-2);color:var(--ink-2);border:2px solid transparent}
.type-seg button.on{color:#fff}
.type-seg button.exp.on{background:var(--expense);border-color:var(--expense)}
.type-seg button.inc.on{background:var(--income);border-color:var(--income)}
.type-seg button.trf.on{background:var(--transfer);border-color:var(--transfer)}

.pick-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.pick{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:2px solid transparent;
  border-radius:12px;padding:9px 12px;font-weight:800;font-size:13.5px;color:var(--ink-2)}
.pick .dot{width:18px;height:18px;border-radius:6px;display:grid;place-items:center;font-size:12px}
.pick.on{border-color:var(--brand);background:#F1EEFE;color:var(--brand-ink)}

.amt-disp{display:flex;align-items:baseline;justify-content:flex-end;gap:4px;padding:8px 4px 2px;min-height:50px}
.amt-disp .cur{font-size:20px;color:var(--ink-3)}
.amt-input{flex:1;min-width:0;border:none;outline:none;background:transparent;text-align:right;
  font-size:38px;font-weight:900;color:var(--ink);padding:0;font-family:inherit;-webkit-appearance:none}
.amt-input::placeholder{color:var(--ink-3);opacity:.5}
.expr{text-align:right;color:var(--ink-3);font-weight:800;min-height:18px;font-size:14px}
.kp-wrap{margin-top:8px}
.kp-wrap summary{font-size:12.5px;font-weight:800;color:var(--brand-ink);cursor:pointer;padding:6px 2px;list-style:none}
.kp-wrap summary::-webkit-details-marker{display:none}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.keypad button{padding:16px 0;border-radius:14px;background:var(--surface-2);font-size:20px;font-weight:800}
.keypad button.op{background:#EDEBFB;color:var(--brand-ink)}
.keypad button:active{transform:scale(.96)}

.btn{display:block;width:100%;padding:14px;border-radius:14px;font-weight:800;font-size:15px;text-align:center}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 6px 16px rgba(108,79,224,.3)}
.btn.ghost{background:var(--surface-2);color:var(--ink-2)}
.btn.danger{background:#FDE7EA;color:var(--expense)}
.btn.sm{padding:11px;font-size:14px}
.btn-row{display:flex;gap:10px;margin-top:14px}
.btn-row .btn{margin:0}

/* ---------- Calendar ---------- */
.cal-nav{width:36px;height:36px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow-sm);display:grid;place-items:center;font-size:18px;font-weight:800;color:var(--ink-2);flex:none}
.cal-sel{flex:1;text-align:center}
.cal-sel .d{font-size:18px;font-weight:900}
.cal-wrap{overflow:hidden;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow-sm);padding:6px 6px 4px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:0}
.wk div{text-align:center;font-size:11px;font-weight:800;color:var(--ink-3);padding:2px 0}
.wk div.sun{color:var(--expense)} .wk div.sat{color:var(--transfer)}
.cal-track{display:flex;width:300%;transform:translateX(-33.333%)}
.cal-track.anim{transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.cal-month{width:33.333%;flex:none;display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.cell{height:44px;border-radius:10px;display:flex;flex-direction:column;align-items:center;padding-top:2px;position:relative;overflow:hidden}
.cell .dn{font-size:12.5px;font-weight:800;width:23px;height:23px;display:grid;place-items:center;border-radius:50%}
.cell.out .dn{color:var(--ink-3);opacity:.4}
.cell.out.sel .dn{opacity:1}
.day-scroll{max-height:340px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.cell.today .dn{color:var(--brand)}
.cell.sel .dn{background:var(--brand);color:#fff}
.cell .ce{font-size:9px;font-weight:800;color:var(--expense);line-height:1.2;margin-top:1px}
.cell .ci{font-size:9px;font-weight:800;color:var(--income);line-height:1.2}

/* report / misc */
.fab-row{display:flex;gap:8px;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.lg-row{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px solid var(--line)}
.lg-row:last-child{border-bottom:none}
.lg-dot{width:12px;height:12px;border-radius:4px;flex:none}
.lg-row .nm{font-weight:800;font-size:14px}
.lg-row .pc{margin-left:auto;text-align:right}
.lg-row .pc b{font-weight:900;font-size:14px}
.lg-row .pc span{display:block;font-size:11px;color:var(--ink-3);font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(var(--navh) + 30px);transform:translateX(-50%) translateY(20px);
  background:#13151B;color:#fff;padding:11px 18px;border-radius:999px;font-weight:800;font-size:13.5px;z-index:90;opacity:0;transition:.25s;max-width:90%}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.swatch-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.sw{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:14px}
.sw.on{outline:3px solid var(--ink);outline-offset:2px}
.emoji-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;max-height:120px;overflow-y:auto;overflow-x:hidden}
.em{width:38px;height:38px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:19px}
.em.on{background:#F1EEFE;outline:2px solid var(--brand)}
.ver-line{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.ver-line:last-child{border:none}
.ver-line b{flex:none;color:var(--brand-ink);font-weight:900;width:36px}
.tag-mini{display:inline-block;font-size:11px;font-weight:800;color:var(--transfer)}
.note-box{background:#FFF7E8;border-radius:12px;padding:10px 12px;font-size:12px;font-weight:700;color:#8a6400;margin-top:8px;line-height:1.5}
details summary{font-weight:800;font-size:13px;color:var(--brand-ink);cursor:pointer;padding:6px 0}
</style>
</head>
<body>
<div id="app">
  <div class="appbar" id="appbar"></div>
  <div id="view"></div>
  <div class="nav" id="nav"></div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="sh-head"><h3 id="sheetTitle"></h3><div class="sh-head-right" id="sheetHeadRight"><button class="icon-btn" id="sheetClose">✕</button></div></div>
  <div class="sh-body" id="sheetBody"></div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================
   記帳 MoneyBook
   ============================================================ */
const VERSION = "1.14.6";
const SCHEMA = 10;
const CHANGELOG = [
  {v:"1.14.6", d:"2026-06-18", items:[
    "Google OAuth Client ID 內建為預設值，設定頁會自動帶入，不用每次手動輸入（仍可自行修改）"
  ]},
  {v:"1.14.5", d:"2026-06-18", items:[
    "帳戶明細與報表分類明細的日期標頭改為置頂（sticky），捲動時日期不會被刷走"
  ]},
  {v:"1.14.4", d:"2026-06-18", items:[
    "帳戶近30天明細也改為依日期分組，同一天的交易接續列出，日期只在每組開頭顯示一次"
  ]},
  {v:"1.14.3", d:"2026-06-18", items:[
    "報表分類明細改為依日期分組，同一天的交易會接續列在一起，日期只在每組開頭顯示一次"
  ]},
  {v:"1.14.2", d:"2026-06-18", items:[
    "報表點分類進去的明細加上日期顯示，並改為唯讀（不可點擊編輯），單純供查閱"
  ]},
  {v:"1.14.1", d:"2026-06-18", items:[
    "交易明細的「複製」「刪除」移到標頭與「儲存」按鈕並排，不用再往下捲動操作"
  ]},
  {v:"1.14.0", d:"2026-06-18", items:[
    "對帳改為逐筆比對：點「對帳」進入該期帳單的交易清單，可一筆一筆打勾核對，並顯示「已核對 X/Y 筆」進度",
    "新增「延後至下期帳單」：某筆交易其實該算在下一期時，可一鍵移到下一期帳單，不影響本期金額；也可隨時復原",
    "記帳時若信用卡帳戶設有多個卡別，卡別改為必選，不會再出現空白未指定的情況"
  ]},
  {v:"1.13.0", d:"2026-06-18", items:[
    "帳單與繳費列表預設只顯示本期與上一期，更早的歷史帳單收合在「顯示更早的帳單」按鈕內，需要時再展開"
  ]},
  {v:"1.12.0", d:"2026-06-18", items:[
    "信用卡帳戶新增「帳單週期」設定（結帳日／繳款日），自動依月份切出每期帳單",
    "新增「帳單與繳費」頁面：可查看每期帳單金額、繳款期限、狀態（累積中／待繳款／已逾期／已繳清）",
    "新增對帳功能：可手動標記每期帳單是否已核對完成",
    "新增繳費功能：可選擇扣款帳戶手動繳款，支援部分繳款（金額可少於應繳金額）",
    "新增自動扣繳：開啟後，到了繳款日會自動從指定帳戶轉帳付清帳單，並在交易列表標示「自動扣繳」"
  ]},
  {v:"1.11.0", d:"2026-06-18", items:[
    "資產走勢圖新增 Y 軸數值與格線，方便直接看出最高、中間、最低資產水位",
    "帳戶頁點進「查看明細」改為只顯示近30天交易，且改為唯讀（不可點擊編輯），單純供快速查閱"
  ]},
  {v:"1.10.0", d:"2026-06-18", items:[
    "信用卡帳戶新增「額度設定」：可選擇多個卡別共用同一筆額度（預設、最常見情況），或各卡別獨立額度",
    "卡片相關用語統一改為「卡別」，更符合信用卡多卡號共用額度的實際情況",
    "共用額度模式下，卡別明細只顯示各卡別的使用金額，不再顯示誤導性的個別額度進度條"
  ]},
  {v:"1.9.0", d:"2026-06-18", items:[
    "報表標籤篩選改為可多選，並新增「排除」模式：可選擇排除特定標籤後再顯示報表，不只能單選查看",
    "分類明細抽屜（點圖表分類進去看交易）也會套用同一套標籤篩選"
  ]},
  {v:"1.8.0", d:"2026-06-18", items:[
    "記帳時帳戶智慧推薦：選類別會自動帶入「該類別最常用的帳戶」，沒有紀錄時改用「上次使用的帳戶」",
    "一旦手動更改帳戶，後續切換類別就不會再自動覆蓋你的選擇"
  ]},
  {v:"1.7.0", d:"2026-06-18", items:[
    "信用卡帳戶可設定信用額度，帳戶詳情會顯示已使用額度進度條",
    "信用卡帳戶可新增多張卡片（例如正卡、副卡），記帳時可選擇是哪張卡，個別查看各卡使用狀況"
  ]},
  {v:"1.6.0", d:"2026-06-18", items:[
    "帳戶分類移除「外幣」（已由幣別欄位取代，任何分類的帳戶都能單獨設定幣別）",
    "幣別選擇改為下拉選單（手機為滾輪選取），預設為新台幣",
    "週期性記帳的頻率選項精簡為「每月」與「每年」"
  ]},
  {v:"1.5.0", d:"2026-06-18", items:[
    "記帳新增「週期性」：可設每天/每週/每月/每年自動產生，結束方式可選「限定次數」或「無期限」",
    "設定新增「週期性記帳」管理，可暫停／繼續／刪除排程，已產生的交易不受影響",
    "自動產生的交易在列表會標示 🔁 週期 字樣"
  ]},

/* ---------- helpers ---------- */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmt(n){ const neg=n<0; n=Math.abs(n); let s=Math.round(n*100)/100;
  s=(s%1===0)? s.toLocaleString("en-US"): s.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}); return (neg?"-":"")+s; }
function money(n){ return CUR+fmt(n); }
function todayStr(){ return dstr(new Date()); }
function dstr(dt){ return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`; }
function parseD(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }

function moneyAcc(n,a){ const code=accCurrency(a); return code==="TWD"? money(n) : currencySymbol(code)+fmt(n); }
function moneyCur(n,code){ return code==="TWD"? money(n) : currencySymbol(code)+fmt(n); }

/* ---------- 週期性記帳 ---------- */
const FREQ_LABEL = {daily:"每天",weekly:"每週",monthly:"每月",yearly:"每年"};
function advanceDate(dateStr, freq, anchorDay){
  const d=parseD(dateStr);
  if(freq==="daily") d.setDate(d.getDate()+1);
  else if(freq==="weekly") d.setDate(d.getDate()+7);
  else if(freq==="monthly"){
    const day=anchorDay||d.getDate();
    d.setDate(1); d.setMonth(d.getMonth()+1);
    const lastDay=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
    d.setDate(Math.min(day,lastDay));
  }
  else if(freq==="yearly") d.setFullYear(d.getFullYear()+1);
  else d.setMonth(d.getMonth()+1);
  return dstr(d);
}
function processRecurring(){
  let changed=false; const today=todayStr();
  (S.recurring||[]).forEach(r=>{
    if(!r.active) return;
    let guard=0;
    while(r.nextDate<=today && guard<366){
      if(r.endMode==="count" && r.generatedCount>=r.count){ r.active=false; break; }
      const rec={ id:uid(), type:r.type, amount:r.amount, accountId:r.accountId, date:r.nextDate, note:r.note||"", tagIds:[...(r.tagIds||[])], ts:Date.now(), recurringId:r.id };
      if(r.type==="transfer") rec.toAccountId=r.toAccountId;
      else { rec.categoryId=r.categoryId||null; rec.projectId=r.projectId||null; rec.cardId=r.cardId||null; }
      S.transactions.push(rec);
      r.generatedCount=(r.generatedCount||0)+1;
      r.nextDate=advanceDate(r.nextDate, r.frequency, r.dayOfMonth);
      changed=true; guard++;
      if(r.endMode==="count" && r.generatedCount>=r.count){ r.active=false; break; }
    }
  });
  if(changed) save();
}

function accountBalance(id){
  const a=acc(id); if(!a) return 0; let b=a.initial||0;
  for(const t of S.transactions){
    if(t.type==="income"&&t.accountId===id) b+=t.amount;
    else if(t.type==="expense"&&t.accountId===id) b-=t.amount;
    else if(t.type==="adjust"&&t.accountId===id) b+=t.amount;
    else if(t.type==="transfer"){ if(t.accountId===id) b-=t.amount; if(t.toAccountId===id) b+=t.amount; }
  }
  return b;
}
function totalAssets(){ return S.accounts.reduce((s,a)=>s+accountBalance(a.id)*fxRate(accCurrency(a)),0); }

function cardUsage(accountId,cardId){
  let exp=0,inc=0;
  S.transactions.forEach(t=>{ if(t.accountId===accountId && t.cardId===cardId){ if(t.type==="expense") exp+=t.amount; else if(t.type==="income") inc+=t.amount; } });
  return exp-inc;
}
/* ---------- 信用卡帳單週期 / 對帳 / 自動扣繳 ---------- */
function clampDay(d){ d=parseInt(d)||1; return Math.min(28,Math.max(1,d)); }
function cycleEndOnOrAfter(billingDay, refDate){
  const y=refDate.getFullYear(), m=refDate.getMonth();
  let end=new Date(y,m,billingDay);
  if(end<refDate) end=new Date(y,m+1,billingDay);
  return end;
}
function cycleDueDate(billingDay,dueDay,endDate){
  const monthOffset = dueDay<=billingDay? 1:0;
  return new Date(endDate.getFullYear(), endDate.getMonth()+monthOffset, dueDay);
}
function cycleKeyOf(endDate){ return dstr(endDate); }
function listRecentCycles(a, count){
  count=count||6;
  const billingDay=clampDay(a.billingDay), dueDay=clampDay(a.dueDay);
  const today=new Date(); today.setHours(0,0,0,0);
  let end=cycleEndOnOrAfter(billingDay, today);
  const cycles=[];
  for(let i=0;i<count;i++){
    const start=new Date(end.getFullYear(), end.getMonth()-1, billingDay+1);
    const due=cycleDueDate(billingDay,dueDay,end);
    cycles.push({ key:cycleKeyOf(end), start, end:new Date(end), due, isOpen:i===0 });
    end=new Date(end.getFullYear(), end.getMonth()-1, billingDay);
  }
  return cycles;
}
function transactionCycleKey(t, a){
  if(t.statementOverride) return t.statementOverride;
  const billingDay=clampDay(a.billingDay);
  const end=cycleEndOnOrAfter(billingDay, parseD(t.date));
  return cycleKeyOf(end);
}
function cycleTxns(accountId, cyc){
  const a=acc(accountId); if(!a) return [];
  return S.transactions.filter(t=> t.accountId===accountId && (t.type==="expense"||t.type==="income") && transactionCycleKey(t,a)===cyc.key);
}
function cycleSpent(accountId, cyc){
  let v=0;
  cycleTxns(accountId,cyc).forEach(t=>{ v += t.type==="expense"? t.amount : -t.amount; });
  return Math.round(v*100)/100;
}
function nextCycleKey(a, cyc){
  const billingDay=clampDay(a.billingDay);
  const afterEnd=new Date(cyc.end.getFullYear(), cyc.end.getMonth(), cyc.end.getDate()+1);
  return cycleKeyOf(cycleEndOnOrAfter(billingDay, afterEnd));
}
function cyclePaid(accountId, key){
  let v=0;
  S.transactions.forEach(t=>{ if(t.type==="transfer" && t.toAccountId===accountId && t.payCycleKey===key) v+=t.amount; });
  return Math.round(v*100)/100;
}

  if(outstanding<=0.005) return {label:"已繳清",cls:"paid"};
  if(dstr(cyc.due)<todayStr()) return {label:"已逾期",cls:"overdue"};
  return {label:"待繳款",cls:"due"};
}
function reconKey(accountId,key){ return accountId+"|"+key; }
function isReconciled(accountId,key){ return !!(S.cardRecon && S.cardRecon[reconKey(accountId,key)]); }
function toggleReconciled(accountId,key){

function syncCycleReconFlag(accountId, cyc){

  if(txns.length && txns.every(t=>isTxnReconciled(t.id))) S.cardRecon[rk]=Date.now();
  else delete S.cardRecon[rk];

function processCardAutoPay(){
  let changed=false; const today=todayStr();
  S.accounts.forEach(a=>{
    if((a.group||"")!=="credit" || !a.autoPay || !a.autoPayAccountId) return;
    const payAcc=acc(a.autoPayAccountId); if(!payAcc) return;
    if(accCurrency(payAcc)!==accCurrency(a)) return;
    listRecentCycles(a,6).forEach(cyc=>{
      if(cyc.isOpen) return;
      if(dstr(cyc.due)>today) return;
      const spent=cycleSpent(a.id,cyc);
      const paid=cyclePaid(a.id,cyc.key);
      const outstanding=Math.round((spent-paid)*100)/100;
      if(outstanding<=0.005) return;
      S.transactions.push({
        id:uid(), type:"transfer", amount:outstanding, accountId:a.autoPayAccountId, toAccountId:a.id,

      });

/* ---------- 依使用習慣推薦（類別／帳戶／備註） ---------- */
function mostUsedCategory(type){
  const counts={};
  S.transactions.forEach(t=>{ if(t.type===type&&t.categoryId) counts[t.categoryId]=(counts[t.categoryId]||0)+1; });
  let best=null,bc=0; Object.entries(counts).forEach(([id,c])=>{ if(c>bc&&cat(id)){ bc=c; best=id; } });
  if(best) return best;
  const l=S.categories.filter(c=>c.type===type); return l[0]?l[0].id:null;
}
function mostUsedAccount(type){
  const counts={};
  S.transactions.forEach(t=>{ if(t.type===type&&t.accountId) counts[t.accountId]=(counts[t.accountId]||0)+1; });
  let best=null,bc=0; Object.entries(counts).forEach(([id,c])=>{ if(c>bc&&acc(id)){ bc=c; best=id; } });
  if(best) return best;
  return S.accounts[0]?S.accounts[0].id:null;
}
function mostUsedAccountForCategory(catId){
  if(!catId) return null;
  const counts={};
  S.transactions.forEach(t=>{ if((t.type==="expense"||t.type==="income")&&t.categoryId===catId&&t.accountId&&acc(t.accountId)) counts[t.accountId]=(counts[t.accountId]||0)+1; });
  let best=null,bc=0; Object.entries(counts).forEach(([id,c])=>{ if(c>bc){ bc=c; best=id; } });
  return best;
}
/* 帳戶推薦：選了類別→該類別最常用帳戶；否則→上次使用的帳戶；再否則→第一個帳戶 */
function recommendAccount(catId){
  const byCat=mostUsedAccountForCategory(catId); if(byCat) return byCat;
  if(S.settings && S.settings.lastAccountId && acc(S.settings.lastAccountId)) return S.settings.lastAccountId;
  return S.accounts[0]?S.accounts[0].id:null;
}
function findNoteMatch(note,type){
  const n=(note||"").trim().toLowerCase(); if(n.length<2) return null;
  const matches=S.transactions.filter(t=>t.type===type&&(t.note||"").trim().toLowerCase()===n);
  if(!matches.length) return null;
  return matches.reduce((a,b)=>(b.ts>a.ts?b:a));
}
function netWorthAt(dateStr){
  let b=S.accounts.reduce((s,a)=>s+(a.initial||0)*fxRate(accCurrency(a)),0);
  for(const t of S.transactions){ if(t.date>dateStr) continue;
    const a=acc(t.accountId); const rate=fxRate(a?accCurrency(a):"TWD");
    if(t.type==="income") b+=t.amount*rate; else if(t.type==="expense") b-=t.amount*rate; else if(t.type==="adjust") b+=t.amount*rate; }
  return b;
}

/* long-press helper */
function onLongPress(el, fn){
  let timer=null, x0=0, y0=0, fired=false;
  const THRESH=14;
  const start=e=>{
    const p=e.touches?e.touches[0]:e; x0=p.clientX; y0=p.clientY; fired=false;
    timer=setTimeout(()=>{ fired=true; timer=null; fn(); }, 480);
  };
  const move=e=>{
    if(timer===null) return;
    const p=e.touches?e.touches[0]:e;
    if(Math.abs(p.clientX-x0)>THRESH||Math.abs(p.clientY-y0)>THRESH){ clearTimeout(timer); timer=null; }
  };
  const end=e=>{ if(timer){ clearTimeout(timer); timer=null; } if(fired) e.preventDefault(); };
  el.addEventListener("touchstart",start,{passive:true});
  el.addEventListener("touchmove",move,{passive:true});
  el.addEventListener("touchend",end);
  el.addEventListener("touchcancel",()=>{ if(timer){ clearTimeout(timer); timer=null; } });
  el.addEventListener("mousedown",start);
  el.addEventListener("mouseup",end);
  el.addEventListener("mouseleave",()=>{ if(timer){ clearTimeout(timer); timer=null; } });
  el.addEventListener("contextmenu",e=>{ e.preventDefault(); fn(); });
}

function buildAssetSeries(){
  const today=new Date(); today.setHours(0,0,0,0); let pts=[];
  if(assetRange==="day"){ for(let i=6;i>=0;i--){ const d=new Date(today); d.setDate(d.getDate()-i); pts.push({label:`${d.getMonth()+1}/${d.getDate()}`,key:dstr(d)}); } }
  else if(assetRange==="week"){ for(let i=6;i>=0;i--){ const d=new Date(today); d.setDate(d.getDate()-i*7); pts.push({label:`${d.getMonth()+1}/${d.getDate()}`,key:dstr(d)}); } }
  else if(assetRange==="month"){ for(let i=6;i>=0;i--){ const d=new Date(today.getFullYear(),today.getMonth()-i+1,0); pts.push({label:`${d.getMonth()+1}月`,key:dstr(d)}); } }
  else { for(let i=6;i>=0;i--){ const y=today.getFullYear()-i; pts.push({label:`${y}`,key:dstr(new Date(y,11,31))}); } }
  return pts.map(p=>({...p,v:netWorthAt(p.key)}));
}
function drawAssetChart(){
  const cv=$("#assetChart"); if(!cv) return;
  const series=buildAssetSeries(); const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth,H=160; cv.width=W*dpr; cv.height=H*dpr;
  const ctx=cv.getContext("2d"); ctx.scale(dpr,dpr); ctx.clearRect(0,0,W,H);
  const vals=series.map(s=>s.v); let mn=Math.min(...vals,0),mx=Math.max(...vals,0); if(mn===mx) mx=mn+1;
  const padT=14,padR=8,padB=22;
  const yLabelText=v=>CUR+kfmt(v);
  ctx.font="700 10px sans-serif";
  const yLabelW=Math.max(ctx.measureText(yLabelText(mx)).width, ctx.measureText(yLabelText(mn)).width);
  const padL=Math.ceil(yLabelW)+10;
  const x=i=> padL+(W-padL-padR)*(series.length===1?0.5:i/(series.length-1));
  const y=v=> padT+(H-padT-padB)*(1-(v-mn)/(mx-mn));
  // Y axis gridlines + value labels (max / mid / min)
  ctx.textAlign="left"; ctx.textBaseline="middle";
  [mx,(mx+mn)/2,mn].forEach(v=>{
    const yp=y(v);
    ctx.strokeStyle="rgba(138,147,163,.18)"; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(padL,yp); ctx.lineTo(W-padR,yp); ctx.stroke();
    ctx.fillStyle="#8A93A3"; ctx.fillText(yLabelText(v),0,yp);
  });
  ctx.textBaseline="alphabetic";
  const grad=ctx.createLinearGradient(0,padT,0,H-padB);
  grad.addColorStop(0,"rgba(108,79,224,.30)"); grad.addColorStop(1,"rgba(108,79,224,0)");
  ctx.beginPath(); series.forEach((s,i)=> i?ctx.lineTo(x(i),y(s.v)):ctx.moveTo(x(i),y(s.v)));
  ctx.lineTo(x(series.length-1),H-padB); ctx.lineTo(x(0),H-padB); ctx.closePath(); ctx.fillStyle=grad; ctx.fill();
  ctx.beginPath(); series.forEach((s,i)=> i?ctx.lineTo(x(i),y(s.v)):ctx.moveTo(x(i),y(s.v)));
  ctx.strokeStyle="#6C4FE0"; ctx.lineWidth=2.5; ctx.lineJoin="round"; ctx.stroke();
  const li=series.length-1;
  ctx.beginPath(); ctx.arc(x(li),y(series[li].v),4,0,7); ctx.fillStyle="#6C4FE0"; ctx.fill();
  ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(x(li),y(series[li].v),1.8,0,7); ctx.fill();
  // x labels — min-gap so they never overlap, first & last always shown
  ctx.fillStyle="#8A93A3"; ctx.font="700 10px sans-serif"; ctx.textAlign="center";
  const clamp=xi=>Math.min(Math.max(xi,padL+16),W-16);
  const minGap=44;
  const chosen=[]; for(let i=0;i<series.length;i++) chosen.push({i,xi:clamp(x(i))});
  let last=-999; const finalIdx=[];
  for(let k=0;k<chosen.length;k++){ const c=chosen[k]; const isLast=c.i===li;
    if(c.i===0){ finalIdx.push(c); last=c.xi; }
    else if(isLast){ if(finalIdx.length&&Math.abs(c.xi-finalIdx[finalIdx.length-1].xi)<minGap) finalIdx.pop(); finalIdx.push(c); }
    else if(c.xi-last>=minGap){ finalIdx.push(c); last=c.xi; }
  }
  finalIdx.forEach(c=> ctx.fillText(series[c.i].label, c.xi, H-7));
  const cap=$("#assetCap");
  if(cap){ const diff=series[li].v-series[0].v; cap.textContent=`區間變化 ${diff>=0?"▲":"▼"} ${money(Math.abs(diff))}`; cap.style.color=diff>=0?"var(--income)":"var(--expense)"; }
}

function openCardStatements(id){

function openCycleRecon(accountId, cyc, back){

      </div>
    </div>`;

  openSheet(`逐筆對帳 · ${periodLabel}`,`
    <button class="btn ghost sm" id="reconBack" style="margin-bottom:10px">‹ 返回帳單列表</button>

    <div class="card tight">${rows}</div>`);
  $("#reconBack").onclick=()=>{ if(back) back(); else closeSheet(); };
  document.querySelectorAll("#sheetBody [data-rtoggle]").forEach(b=>b.onclick=()=>{

    openCycleRecon(accountId, cyc, back);
  });
  document.querySelectorAll("#sheetBody [data-defer]").forEach(b=>b.onclick=()=>{
    const t=S.transactions.find(x=>x.id===b.dataset.defer); if(!t) return;
    t.statementOverride=nextCycleKey(a,cyc);
    if(S.txnRecon) delete S.txnRecon[t.id];

    const t=S.transactions.find(x=>x.id===b.dataset.undefer); if(!t) return;
    t.statementOverride=null;

function dayTotals(dateStr){ let exp=0,inc=0; for(const t of S.transactions){ if(t.date!==dateStr) continue; if(t.type==="expense")exp+=t.amount; else if(t.type==="income")inc+=t.amount; } return {exp,inc}; }
function kfmt(n){ const neg=n<0; const a=Math.abs(n); let s; if(a>=100000) s=(a/10000).toFixed(0)+"萬"; else if(a>=10000) s=(a/10000).toFixed(1)+"萬"; else s=fmt(a); return (neg?"-":"")+s; }
function monthGridHTML(refY,refM){
  const first=new Date(refY,refM,1); const startDow=first.getDay();
  const start=new Date(refY,refM,1-startDow); let cells="";
  for(let i=0;i<42;i++){ const d=new Date(start); d.setDate(start.getDate()+i); const ds=dstr(d);
    const out=d.getMonth()!==refM; const isToday=ds===todayStr(); const isSel=ds===calSel;
    const {exp,inc}=dayTotals(ds);
    cells+=`<div class="cell ${out?'out':''} ${isToday?'today':''} ${isSel?'sel':''}" data-d="${ds}">
      <div class="dn">${d.getDate()}</div>
      ${exp?`<div class="ce num">-${kfmt(exp)}</div>`:""}${inc?`<div class="ci num">+${kfmt(inc)}</div>`:""}</div>`;
  }
  return `<div class="cal-month">${cells}</div>`;
}
function renderCalendar(){
  renderAppbar();
  const y=calRef.getFullYear(),m=calRef.getMonth();
  const prev=new Date(y,m-1,1),next=new Date(y,m+1,1);

  <div class="cal-wrap">

    <div class="cal-track" id="calTrack">
      ${monthGridHTML(prev.getFullYear(),prev.getMonth())}
      ${monthGridHTML(y,m)}
      ${monthGridHTML(next.getFullYear(),next.getMonth())}
    </div>
  </div>
  <div class="card" style="margin-top:10px">
    <div class="h-row" style="margin-bottom:8px">
      <h2 style="font-size:15px">${selD.getMonth()+1}/${selD.getDate()} 明細</h2>
      <div style="font-size:12.5px;font-weight:900">
        ${exp?`<span style="color:var(--expense)">-${fmt(exp)}</span>`:""}
        ${inc?`<span style="color:var(--income);margin-left:8px">+${fmt(inc)}</span>`:""}
        ${!exp&&!inc?`<span class="muted">無交易</span>`:""}</div></div>
    <div id="dayList" class="day-scroll"></div></div>`;
  const list=S.transactions.filter(t=>t.date===calSel).sort((a,b)=>b.ts-a.ts);
  $("#dayList").innerHTML=list.length? list.map(t=>txnRowHTML(t)).join(""):`<div class="empty" style="padding:22px"><div class="ico">📝</div>這天還沒有紀錄<br><span style="font-size:12px">點下方 ＋ 記一筆</span></div>`;
  bindTxnRows();
  $("#calTrack").querySelectorAll(".cell").forEach(c=>c.onclick=()=>{ calSel=c.dataset.d; renderCalendar(); });
  bindSwipe();
}
function shiftMonth(dir){
  const t=$("#calTrack"); if(!t){ calRef.setMonth(calRef.getMonth()+dir); calRef.setDate(1); renderCalendar(); return; }
  t.classList.add("anim"); t.style.transform=`translateX(${dir>0?"-66.666%":"0%"})`;
  setTimeout(()=>{ calRef.setMonth(calRef.getMonth()+dir); calRef.setDate(1); renderCalendar(); },280);
}
function bindSwipe(){
  const t=$("#calTrack"); if(!t) return; let x0=null,y0=null,dx=0,drag=false;
  t.addEventListener("touchstart",e=>{ x0=e.touches[0].clientX; y0=e.touches[0].clientY; dx=0; drag=false; t.classList.remove("anim"); },{passive:true});
  t.addEventListener("touchmove",e=>{ if(x0===null) return; dx=e.touches[0].clientX-x0; const dy=e.touches[0].clientY-y0;
    if(!drag&&Math.abs(dx)>Math.abs(dy)+6) drag=true; if(drag) t.style.transform=`translateX(calc(-33.333% + ${dx}px))`; },{passive:true});
  t.addEventListener("touchend",()=>{ if(x0===null) return; const thr=t.clientWidth*0.22;
    if(drag&&Math.abs(dx)>thr) shiftMonth(dx<0?1:-1); else { t.classList.add("anim"); t.style.transform="translateX(-33.333%)"; } x0=null; });
}

function reportRange(){
  const d=new Date(reportRef);
  if(reportPeriod==="week"){
    const dow=d.getDay(); const start=new Date(d); start.setDate(d.getDate()-dow);
    const end=new Date(start); end.setDate(start.getDate()+6);
    return {start,end,label:`${start.getMonth()+1}/${start.getDate()} - ${end.getMonth()+1}/${end.getDate()}`};
  }
  if(reportPeriod==="year"){
    return {start:new Date(d.getFullYear(),0,1), end:new Date(d.getFullYear(),11,31), label:`${d.getFullYear()}年`};
  }
  return {start:new Date(d.getFullYear(),d.getMonth(),1), end:new Date(d.getFullYear(),d.getMonth()+1,0), label:`${d.getFullYear()}年 ${d.getMonth()+1}月`};
}
function shiftReportRef(dir){
  if(reportPeriod==="week") reportRef.setDate(reportRef.getDate()+dir*7);
  else if(reportPeriod==="year") reportRef.setFullYear(reportRef.getFullYear()+dir);
  else reportRef.setMonth(reportRef.getMonth()+dir);
}
function renderReport(){

  let pool=rangeTx.filter(t=>t.type===reportType);

  const total=rows.reduce((s,r)=>s+r.val,0);

      <div class="card" style="flex:1;margin:0;padding:12px;text-align:center;background:var(--surface-2);box-shadow:none"><div class="muted" style="font-size:11px">總支出</div><div class="num" style="font-weight:900;color:var(--expense);font-size:18px">${money(totExp)}</div></div>
      <div class="card" style="flex:1;margin:0;padding:12px;text-align:center;background:var(--surface-2);box-shadow:none"><div class="muted" style="font-size:11px">總收入</div><div class="num" style="font-weight:900;color:var(--income);font-size:18px">${money(totInc)}</div></div>
      <div class="card" style="flex:1;margin:0;padding:12px;text-align:center;background:var(--surface-2);box-shadow:none"><div class="muted" style="font-size:11px">結餘</div><div class="num" style="font-weight:900;color:${totInc-totExp>=0?'var(--income)':'var(--expense)'};font-size:18px">${money(totInc-totExp)}</div></div></div>
    ${hasForexTx?`<p class="muted" style="font-size:11px;margin:8px 2px 0">含外幣交易，已依匯率換算為台幣等值合計</p>`:""}
  </div>
  <div class="card">
    <div class="seg" style="margin-bottom:12px">
      <button data-rt="expense" class="${reportType==='expense'?'on':''}">支出</button>
      <button data-rt="income" class="${reportType==='income'?'on':''}">收入</button></div>
    ${S.tags.length?`<div class="h-row" style="margin:0 0 8px">
      <span class="muted" style="font-size:12px;font-weight:800">標籤篩選</span>
      <div class="seg" style="width:160px">

    ${rows.length?`

        <span class="pc"><b class="num">${money(r.val)}</b><span>${(r.val/total*100).toFixed(1)}%</span></span></button>`).join("")}</div>
    `:`<div class="empty"><div class="ico">📊</div>這段時間沒有符合的${reportType==='expense'?'支出':'收入'}紀錄</div>`}
  </div>`;

  view.querySelectorAll("[data-rp]").forEach(b=>b.onclick=()=>{ reportPeriod=b.dataset.rp; renderReport(); });
  view.querySelectorAll("[data-rt]").forEach(b=>b.onclick=()=>{ reportType=b.dataset.rt; renderReport(); });
  view.querySelectorAll("[data-tfm]").forEach(b=>b.onclick=()=>{ reportTagMode=b.dataset.tfm; renderReport(); });
  view.querySelectorAll("[data-ftag]").forEach(b=>b.onclick=()=>{ const id=b.dataset.ftag; const i=reportTagIds.indexOf(id); if(i<0) reportTagIds.push(id); else reportTagIds.splice(i,1); renderReport(); });

  view.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>openCatDrill(b.dataset.cat,s,e));

function drawDonut(rows,total){
  const cv=$("#donut"); if(!cv) return; const dpr=window.devicePixelRatio||1,SZ=160;
  cv.width=SZ*dpr; cv.height=SZ*dpr; const ctx=cv.getContext("2d"); ctx.scale(dpr,dpr);
  const cx=80,cy=80,R=66,r=44; let a0=-Math.PI/2;
  rows.forEach(row=>{ const a1=a0+(row.val/total)*Math.PI*2; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,R,a0,a1); ctx.closePath(); ctx.fillStyle=row.color; ctx.fill(); a0=a1; });
  ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.fillStyle="#fff"; ctx.fill();
}
function openCatDrill(cid,s,e){
  const c=cat(cid);
  let list=S.transactions.filter(t=>t.date>=s&&t.date<=e&&t.type===reportType&&(t.categoryId||"_none")===cid);
  if(reportTagIds.length) list=list.filter(tagFilterPass);
  list.sort((a,b)=> a.date<b.date?1:a.date>b.date?-1:b.ts-a.ts);
  const WD=["日","一","二","三","四","五","六"];
  const groups=[];
  list.forEach(t=>{
    let g=groups[groups.length-1];
    if(!g||g.date!==t.date){ g={date:t.date,items:[]}; groups.push(g); }
    g.items.push(t);
  });
  const html=groups.map(g=>{
    const d=parseD(g.date);
    const isToday=g.date===todayStr();
    return `<div class="date-sep">${d.getMonth()+1}/${d.getDate()} 週${WD[d.getDay()]}${isToday?"（今天）":""}</div>`
      + g.items.map(t=>txnRowHTML(t,true,false)).join("");
  }).join("");
  openSheet(`${c?c.icon:"❓"} ${c?escapeHtml(c.name):"未分類"}`,
    `<p class="muted" style="font-size:11.5px;margin:0 2px 10px">唯讀僅供查閱，如需編輯請至月曆點選該筆交易</p>`+
    (groups.length? html:`<div class="empty">無紀錄</div>`));
}

function exportCSV(){
  if(!S.transactions.length){ toast("尚無交易可匯出"); return; }
  const typeName={expense:"支出",income:"收入",transfer:"轉帳",adjust:"餘額調整"};
  const rows=[["日期","類型","金額","幣別","帳戶","轉入帳戶","類別","標籤","專案","備註"]];
  S.transactions.slice().sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:a.ts-b.ts).forEach(t=>{
    const a=acc(t.accountId), ta=acc(t.toAccountId), c=cat(t.categoryId), p=proj(t.projectId);
    rows.push([
      t.date, typeName[t.type]||t.type, t.amount, a?accCurrency(a):"TWD",
      a?a.name:"", t.type==="transfer"?(ta?ta.name:""):"",
      c?c.name:"", txnTags(t).map(x=>x.name).join("、"),
      p?p.name:"", t.note||""
    ]);
  });
  const csv="\uFEFF"+rows.map(r=>r.map(csvEsc).join(",")).join("\r\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=url; a.download=`moneybook_${todayStr()}.csv`; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000); toast("已匯出 CSV");
}
function exportData(){

function importData(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".json,application/json";
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.accounts||!d.transactions){ toast("檔案格式不符"); return; }
      if(confirm("匯入將覆蓋目前所有資料，確定？")){ S=migrate(d); save(); render(); toast("已匯入資料"); } }catch(e){ toast("讀取失敗"); } };
    r.readAsText(f); };
  inp.click();
}

/* ============================================================ Google Drive sync */
let googleToken=null, tokenClient=null;
function gisReady(){ return typeof google!=="undefined" && google.accounts && google.accounts.oauth2; }
function loadGIS(cb){
  if(gisReady()) return cb();
  const existing=document.getElementById("gisScript");
  if(existing){ const t=setInterval(()=>{ if(gisReady()){ clearInterval(t); cb(); } },200); setTimeout(()=>clearInterval(t),8000); return; }
  const s=document.createElement("script"); s.id="gisScript"; s.src="https://accounts.google.com/gsi/client"; s.async=true; s.defer=true;
  s.onload=()=>cb(); s.onerror=()=>toast("無法載入 Google 登入（需網路與部署環境）");
  document.head.appendChild(s);
}
function googleSignIn(cb){
  const cid=(S.settings.googleClientId||DEFAULT_GOOGLE_CLIENT_ID||"").trim();
  if(!cid){ toast("請先填入 Google Client ID"); return; }
  loadGIS(()=>{
    try{
      tokenClient=google.accounts.oauth2.initTokenClient({
        client_id:cid, scope:"https://www.googleapis.com/auth/drive.appdata",
        callback:resp=>{ if(resp&&resp.access_token){ googleToken=resp.access_token; cb&&cb(); } else toast("登入失敗"); }
      });
      tokenClient.requestAccessToken({prompt:""});
    }catch(e){ toast("登入初始化失敗，請檢查 Client ID 與授權網域"); }
  });
}
function ensureToken(cb){ if(googleToken) return cb(); googleSignIn(cb); }
async function driveFind(){
  const q=encodeURIComponent("name='moneybook.json'");
  const r=await fetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,name,modifiedTime)`,{headers:{Authorization:"Bearer "+googleToken}});
  if(!r.ok) throw new Error("find "+r.status); const j=await r.json(); return j.files&&j.files[0];
}
function googleBackup(){
  ensureToken(async()=>{
    try{
      toast("備份中…"); const body=JSON.stringify(S); const file=await driveFind();
      let r;
      if(file){ r=await fetch(`https://www.googleapis.com/upload/drive/v3/files/${file.id}?uploadType=media`,{method:"PATCH",headers:{Authorization:"Bearer "+googleToken,"Content-Type":"application/json"},body}); }
      else{ const boundary="bnd"+uid(); const meta={name:"moneybook.json",parents:["appDataFolder"]};
        const mp=`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${boundary}--`;
        r=await fetch(`https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`,{method:"POST",headers:{Authorization:"Bearer "+googleToken,"Content-Type":`multipart/related; boundary=${boundary}`},body:mp}); }
      if(!r.ok) throw new Error("upload "+r.status);
      toast("已備份到雲端 ☁️");
    }catch(e){ console.warn(e); toast("備份失敗，請重新登入再試"); }
  });
}
function googleRestore(){
  ensureToken(async()=>{
    try{
      toast("讀取雲端…"); const file=await driveFind(); if(!file){ toast("雲端尚無備份"); return; }
      const r=await fetch(`https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`,{headers:{Authorization:"Bearer "+googleToken}});
      if(!r.ok) throw new Error("download "+r.status); const d=await r.json();
      if(!d.accounts||!d.transactions){ toast("雲端資料格式不符"); return; }
      if(confirm("從雲端還原將覆蓋目前所有本機資料，確定？")){ S=migrate(d); save(); render(); toast("已從雲端還原"); }
    }catch(e){ console.warn(e); toast("還原失敗，請重新登入再試"); }
  });
}

/* ============================================================ 交易列 / 記帳 */
function txnRowHTML(t, readOnly, showDate){
  let icon,color,title,sub,amtClass,sign,amtVal,curCode="TWD";
  const tagStr=txnTags(t).map(x=>"#"+x.name).join(" ");
  if(t.type==="transfer"){
    const fa=acc(t.accountId),ta=acc(t.toAccountId);
    icon=t.autoPay?"🤖":"🔁"; color="var(--transfer)"; title=t.autoPay?"自動扣繳":"轉帳"; sub=`${fa?fa.name:"?"} → ${ta?ta.name:"?"}${t.note?" · "+t.note:""}`;
    amtClass="tr"; sign=""; amtVal=t.amount; curCode=fa?accCurrency(fa):"TWD";
  }else if(t.type==="adjust"){
    const a=acc(t.accountId); icon="⚖️"; color="var(--adjust)"; title="餘額調整";
    sub=`${a?a.name:"?"}${t.note?" · "+t.note:""}`; amtClass=t.amount>=0?"pos":"neg"; sign=t.amount>=0?"+":"-"; amtVal=Math.abs(t.amount); curCode=a?accCurrency(a):"TWD";
  }else{
    const c=cat(t.categoryId),a=acc(t.accountId),p=proj(t.projectId),card=a?cardOf(a,t.cardId):null;
    icon=c?c.icon:(t.type==="income"?"💰":"💸"); color=c?c.color:"var(--ink-3)";
    title=c?c.name:(t.type==="income"?"收入":"支出");
    sub=`${a?a.name:"?"}${card?" · "+card.name:""}${p?" · "+p.icon+p.name:""}${t.note?" · "+t.note:""}`;
    amtClass=t.type==="income"?"pos":"neg"; sign=t.type==="income"?"+":"-"; amtVal=t.amount; curCode=a?accCurrency(a):"TWD";
  }
  const curPrefix=curCode!=="TWD"? currencySymbol(curCode):"";
  const tag=readOnly?"div":"button";
  const dateLabel=showDate? `${parseD(t.date).getMonth()+1}/${parseD(t.date).getDate()} · `:"";
  return `<${tag} class="row${readOnly?"":" txn-row"}" style="width:100%;text-align:left"${readOnly?"":` data-txn="${t.id}"`}>
    <div class="av" style="width:38px;height:38px;font-size:18px;border-radius:11px;background:${color}">${icon}</div>
    <div style="min-width:0"><div class="nm">${escapeHtml(title)}</div>
      <div class="sub" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px">${dateLabel}${escapeHtml(sub)}${tagStr?` <span class="tag-mini">${escapeHtml(tagStr)}</span>`:""}${t.recurringId?` <span class="tag-mini">🔁週期</span>`:""}</div></div>
    <div class="amt num ${amtClass}">${sign}${curPrefix}${fmt(amtVal)}</div></${tag}>`;
}
function bindTxnRows(){ document.querySelectorAll(".txn-row").forEach(b=>b.onclick=()=>{ const t=S.transactions.find(x=>x.id===b.dataset.txn); if(t) openTxnSheet(t); }); }

function openTxnSheet(opts){
  opts=opts||{};

  const initType=opts.type||"expense";
  let userPickedAccount = !!opts.accountId;   // 從帳戶頁進來＝已指定帳戶，不自動覆蓋
  let model;
  if(editing){ model={...editing}; model.tagIds=[...(editing.tagIds||[])]; }
  else model={
    type:initType, amount:opts.amount||0,
    accountId:opts.accountId|| null,
    toAccountId:opts.toAccountId||(S.accounts[1]&&S.accounts[1].id)||(S.accounts[0]&&S.accounts[0].id),
    categoryId:opts.categoryId|| (initType!=="transfer"? mostUsedCategory(initType):null),
    tagIds:[...(opts.tagIds||[])], projectId:opts.projectId||null, cardId:opts.cardId||null,
    note:opts.note||"", date:opts.date||calSel||todayStr(),

    if(model.type==="transfer") return;
    const a=acc(model.accountId); const cds=(a&&a.cards)||[];
    if(cds.length){ if(!model.cardId || !cds.some(c=>c.id===model.cardId)) model.cardId=cds[0].id; }
    else model.cardId=null;
  }
  ensureCardDefault();

  function bodyHTML(){
    const isTr=model.type==="transfer";

    return `
    <div class="amt-disp"><span class="cur" id="curSym">${currencySymbol(accCurrency(acc(model.accountId)))}</span><input id="amtInput" class="amt-input num" inputmode="decimal" autocomplete="off" placeholder="0" value="${escapeHtml(initExpr)}"></div>
    <div class="expr num" id="exprView"></div>
    <div class="type-seg">
      <button class="exp ${model.type==='expense'?'on':''}" data-ty="expense">支出</button>
      <button class="inc ${model.type==='income'?'on':''}" data-ty="income">收入</button>
      <button class="trf ${model.type==='transfer'?'on':''}" data-ty="transfer">轉帳</button></div>
    ${isTr?`
      <label class="fld"><span class="lb">從帳戶</span><select class="input" id="fAcc">${accountOptionsHTML(model.accountId)}</select></label>
      <label class="fld"><span class="lb">到帳戶</span><select class="input" id="tAcc">${accountOptionsHTML(model.toAccountId)}</select></label>
      <p class="muted" style="font-size:11px;margin:6px 2px 0">目前不支援不同幣別帳戶間直接轉帳換匯</p>
    `:`
      <div class="fld"><span class="lb">類別 <span class="muted" style="font-weight:700;font-size:11px">· 已依使用習慣推薦</span></span>
        <div class="pick-grid" id="catPick">${catsFor(model.type).map(c=>`<button class="pick ${c.id===model.categoryId?'on':''}" data-cat="${c.id}"><span class="dot" style="background:${c.color}">${c.icon}</span>${escapeHtml(c.name)}</button>`).join("")||'<span class="muted" style="font-size:12px">尚無類別，可到設定新增</span>'}</div></div>
      <div class="fld"><span class="lb">標籤（可多選）</span>
        <div class="pick-grid" id="tagPick">${S.tags.map(t=>`<button class="pick ${model.tagIds.includes(t.id)?'on':''}" data-tg="${t.id}"><span class="dot" style="background:${t.color}"></span>${escapeHtml(t.name)}</button>`).join("")}<button class="pick" id="addTagInline" style="border:2px dashed var(--line)">＋ 新增</button></div></div>
      <label class="fld"><span class="lb">帳戶${(!editing&&!userPickedAccount)?' <span class="muted" style="font-weight:700;font-size:11px">· 依類別自動推薦</span>':''}</span><select class="input" id="acc">${accountOptionsHTML(model.accountId)}</select></label>
      <div class="fld" id="cardPickWrap" style="${curCards.length?"":"display:none"}">
        <span class="lb">卡別</span>
        <select class="input" id="cardSel">${curCards.map(c=>`<option value="${c.id}" ${model.cardId===c.id?"selected":""}>${escapeHtml(c.name)}</option>`).join("")}</select>
      </div>
      <label class="fld"><span class="lb">專案（選填）</span><select class="input" id="prj"><option value="">— 無 —</option>${S.projects.map(p=>`<option value="${p.id}" ${p.id===model.projectId?"selected":""}>${p.icon} ${escapeHtml(p.name)}</option>`).join("")}</select></label>
    `}
    <label class="fld"><span class="lb">日期</span><input class="input" id="txDate" type="date" value="${model.date}"></label>
    ${!editing?`
    <div class="fld"><span class="lb">記帳方式</span>
      <div class="seg" style="margin-top:4px">
        <button data-rec="off" class="${!model.recurring?'on':''}">單次</button>
        <button data-rec="on" class="${model.recurring?'on':''}">週期性</button></div>
      ${model.recurring?`
      <div style="margin-top:12px"><span class="lb">頻率</span>
        <div class="seg" style="margin-top:4px">
          <button data-rf="monthly" class="${model.recFreq==='monthly'?'on':''}">每月</button>
          <button data-rf="yearly" class="${model.recFreq==='yearly'?'on':''}">每年</button></div></div>
      <div style="margin-top:12px"><span class="lb">結束方式</span>
        <div class="seg" style="margin-top:4px">
          <button data-rem="count" class="${model.recEndMode==='count'?'on':''}">限定次數</button>
          <button data-rem="none" class="${model.recEndMode==='none'?'on':''}">無期限</button></div>
        ${model.recEndMode==='count'
          ?`<input class="input num" id="recCount" style="margin-top:10px" type="text" inputmode="numeric" placeholder="總次數，例如 12" value="${model.recCount||12}">`
          :`<p class="muted" style="font-size:11.5px;margin:8px 2px 0">會持續產生，直到你到設定頁手動停止</p>`}
      </div>`:""}
    </div>`:""}
    <label class="fld"><span class="lb">備註（選填）</span><textarea class="input" id="txNote" placeholder="輸入備註…例如店家名稱，下次會自動帶入常用設定">${escapeHtml(model.note)}</textarea></label>
    <p class="muted" style="font-size:11.5px;margin:10px 2px 0">金額可直接用鍵盤輸入；也可展開下方計算機按鍵</p>
    <details class="kp-wrap"><summary>🧮 顯示計算機按鍵</summary>
    <div class="keypad" id="kp">
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="op" data-k="/">÷</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button class="op" data-k="*">×</button>
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button class="op" data-k="-">−</button>
      <button data-k=".">.</button><button data-k="0">0</button><button data-k="back">⌫</button><button class="op" data-k="+">＋</button></div></details>
    `;
  }
  openSheet(editing?"編輯交易":(model.type==="transfer"?"轉帳":"記一筆"), bodyHTML(), {
    actionLabel:editing?"儲存":"完成", onAction:()=>commit(),
    extraActions: editing? [
      {icon:"📑", label:"複製這筆", onClick:()=>{ readInputs(); const copy={...model}; delete copy.id; closeSheet(); setTimeout(()=>openTxnSheet({...copy}),120); }},
      {icon:"🗑️", label:"刪除這筆", danger:true, onClick:()=>{ if(confirm("刪除這筆交易？")){ S.transactions=S.transactions.filter(t=>t.id!==editing.id); save(); closeSheet(); render(); toast("已刪除"); } }}
    ] : []
  });
  bindBody();
  updateCurDisplay();
  setTimeout(()=>{ const el=$("#amtInput"); if(el){ el.focus(); const L=el.value.length; el.setSelectionRange&&el.setSelectionRange(L,L); } },320);

  function bindBody(){
    document.querySelectorAll("#sheetBody [data-ty]").forEach(b=>b.onclick=()=>{
      readInputs();
      model.type=b.dataset.ty;
      if(model.type!=="transfer"){ model.categoryId=mostUsedCategory(model.type); }
      if(!editing && !userPickedAccount){ model.accountId=recommendAccount(model.type!=="transfer"? model.categoryId:null); }
      ensureCardDefault();
      const keep=$("#amtInput")?$("#amtInput").value:""; $("#sheetBody").innerHTML=bodyHTML(); bindBody();
      const el=$("#amtInput"); if(el) el.value=keep; updateCurDisplay();
    });
    document.querySelectorAll("#sheetBody [data-cat]").forEach(b=>b.onclick=()=>{
      model.categoryId=b.dataset.cat;
      document.querySelectorAll("#sheetBody [data-cat]").forEach(x=>x.classList.toggle("on",x===b));
      if(!editing && !userPickedAccount){
        const rec=recommendAccount(model.categoryId);
        if(rec && rec!==model.accountId){
          model.accountId=rec; ensureCardDefault();
          const sel=$("#acc"); if(sel) sel.value=rec;
          updateCurDisplay(); refreshCardPicker();
          const a=acc(rec); if(a) toast("已推薦帳戶："+a.name);
        }
      }
    });
    document.querySelectorAll("#sheetBody [data-tg]").forEach(b=>b.onclick=()=>{ const id=b.dataset.tg; const i=model.tagIds.indexOf(id); if(i<0) model.tagIds.push(id); else model.tagIds.splice(i,1); b.classList.toggle("on"); });
    document.querySelectorAll("#sheetBody [data-rec]").forEach(b=>b.onclick=()=>{
      model.recurring = b.dataset.rec==="on";
      readInputs(); const keep=$("#amtInput")?$("#amtInput").value:""; $("#sheetBody").innerHTML=bodyHTML(); bindBody();
      const el=$("#amtInput"); if(el) el.value=keep; updateCurDisplay();
    });
    document.querySelectorAll("#sheetBody [data-rf]").forEach(b=>b.onclick=()=>{ model.recFreq=b.dataset.rf; document.querySelectorAll("#sheetBody [data-rf]").forEach(x=>x.classList.toggle("on",x===b)); });
    document.querySelectorAll("#sheetBody [data-rem]").forEach(b=>b.onclick=()=>{
      model.recEndMode=b.dataset.rem;
      readInputs(); const keep=$("#amtInput")?$("#amtInput").value:""; $("#sheetBody").innerHTML=bodyHTML(); bindBody();
      const el=$("#amtInput"); if(el) el.value=keep; updateCurDisplay();
    });
    const addT=$("#addTagInline"); if(addT) addT.onclick=()=>{ const name=prompt("新增標籤名稱"); if(name&&name.trim()){ const nt={id:uid(),name:name.trim(),color:COLORS[S.tags.length%COLORS.length]}; S.tags.push(nt); model.tagIds.push(nt.id); save(); readInputs(); const keep=$("#amtInput")?$("#amtInput").value:""; $("#sheetBody").innerHTML=bodyHTML(); bindBody(); const el=$("#amtInput"); if(el) el.value=keep; updateCurDisplay(); } };
    document.querySelectorAll("#sheetBody #kp button").forEach(b=>b.onclick=()=>press(b.dataset.k));
    const amtEl=$("#amtInput");
    if(amtEl) amtEl.addEventListener("input",()=>{ amtEl.value=amtEl.value.replace(/[^0-9+\-*/.]/g,""); updateAmt(); });
    const cardSel=$("#cardSel");
    if(cardSel) cardSel.addEventListener("change",()=>{ model.cardId=cardSel.value; });
    const accSel=$("#acc")||$("#fAcc");
    if(accSel) accSel.addEventListener("change",()=>{ model.accountId=accSel.value; userPickedAccount=true; if($("#acc")){ ensureCardDefault(); } updateCurDisplay(); refreshCardPicker(); });
    const toSel=$("#tAcc");
    if(toSel) toSel.addEventListener("change",()=>{ model.toAccountId=toSel.value; });
    const noteEl=$("#txNote");
    if(noteEl && !editing) noteEl.addEventListener("blur", applyNoteSuggestion);
  }
  function readInputs(){ const g=id=>document.getElementById(id);
    if(g("acc")) model.accountId=g("acc").value; if(g("fAcc")) model.accountId=g("fAcc").value; if(g("tAcc")) model.toAccountId=g("tAcc").value;
    if(g("prj")) model.projectId=g("prj").value||null; if(g("txDate")) model.date=g("txDate").value; if(g("txNote")) model.note=g("txNote").value.trim();
    if(g("recCount")) model.recCount=parseInt(g("recCount").value)||1;
  }
  function applyNoteSuggestion(){
    if(editing||model.type==="transfer") return;
    const noteEl=$("#txNote"); if(!noteEl) return;
    const match=findNoteMatch(noteEl.value, model.type); if(!match) return;
    let changed=false;
    if(match.categoryId && match.categoryId!==model.categoryId){
      model.categoryId=match.categoryId;
      document.querySelectorAll("#sheetBody [data-cat]").forEach(b=>b.classList.toggle("on", b.dataset.cat===match.categoryId));
      changed=true;
    }
    if(match.accountId && match.accountId!==model.accountId){
      model.accountId=match.accountId; userPickedAccount=true;
      const sel=document.getElementById("acc"); if(sel) sel.value=match.accountId;
      ensureCardDefault(); refreshCardPicker();
      updateCurDisplay();
      changed=true;
    }
    if(Array.isArray(match.tagIds) && match.tagIds.length){
      model.tagIds=[...match.tagIds];
      document.querySelectorAll("#sheetBody [data-tg]").forEach(b=>b.classList.toggle("on", model.tagIds.includes(b.dataset.tg)));
      changed=true;
    }
    if(match.projectId){
      model.projectId=match.projectId;
      const sel=document.getElementById("prj"); if(sel) sel.value=match.projectId;
      changed=true;
    }
    if(changed) toast(`已套用「${noteEl.value.trim()}」常用設定`);
  }
  function press(k){
    const el=$("#amtInput"); if(!el) return; let v=el.value;
    if(k==="back") v=v.slice(0,-1);
    else if(k==="."){ if(!/[.][^+\-*/]*$/.test(v)) v+=v===""?"0.":"."; }
    else if("+-*/".includes(k)){ if(v===""){ if(k==="-") v="-"; } else if("+-*/".includes(v.slice(-1))) v=v.slice(0,-1)+k; else v+=k; }
    else v+=k;
    el.value=v; el.focus(); const L=v.length; el.setSelectionRange&&el.setSelectionRange(L,L); updateAmt();
  }
  function currentCurCode(){ const a=acc(model.accountId); return a?accCurrency(a):"TWD"; }
  function refreshCardPicker(){
    const wrap=$("#cardPickWrap"); if(!wrap) return;
    const a=acc(model.accountId); const cds=(a&&a.cards)||[];
    if(!cds.length){ wrap.style.display="none"; wrap.innerHTML=""; return; }
    wrap.style.display="";
    wrap.innerHTML=`<span class="lb">卡別</span><select class="input" id="cardSel">${cds.map(c=>`<option value="${c.id}" ${model.cardId===c.id?"selected":""}>${escapeHtml(c.name)}</option>`).join("")}</select>`;
    const sel=$("#cardSel"); if(sel) sel.addEventListener("change",()=>{ model.cardId=sel.value; });
  }
  function updateCurDisplay(){
    const cs=$("#curSym"); if(cs) cs.textContent=currencySymbol(currentCurCode());
    updateAmt();
  }
  function updateAmt(){
    const el=$("#amtInput"),ev=$("#exprView"); if(!el||!ev) return;
    const v=el.value;
    ev.textContent=(v&&/[+\-*/]/.test(v))? "= "+moneyCur(parseFloat(safeCalc(v))||0, currentCurCode()) : "";
  }
  function commit(){
    readInputs(); const raw=$("#amtInput")?$("#amtInput").value:"0"; const amt=parseFloat(safeCalc(raw));
    if(!amt||amt<=0){ toast("請輸入金額"); return; }
    if(model.type!=="transfer"){
      const curAcc=acc(model.accountId); const curCards=(curAcc&&curAcc.cards)||[];
      if(curCards.length && !curCards.some(c=>c.id===model.cardId)){ toast("這個帳戶有多個卡別，請選擇是哪一張"); return; }
    }
    if(model.accountId){ S.settings=S.settings||{}; S.settings.lastAccountId=model.accountId; }
    if(model.type==="transfer"){
      if(model.accountId===model.toAccountId){ toast("轉出與轉入帳戶不能相同"); return; }
      const fa=acc(model.accountId), ta=acc(model.toAccountId);
      if(fa && ta && accCurrency(fa)!==accCurrency(ta)){ toast("不同幣別帳戶間目前不支援直接轉帳換匯，請改用調整餘額分別記錄"); return; }
    }
    if(!editing && model.recurring){
      const count = model.recEndMode==="count"? Math.max(1,parseInt(model.recCount)||1) : null;
      const rule={
        id:uid(), type:model.type, amount:Math.round(amt*100)/100,
        accountId:model.accountId, note:model.note,
        frequency:model.recFreq||"monthly", endMode:model.recEndMode||"count",
        count, generatedCount:0, nextDate:model.date||todayStr(), dayOfMonth:parseD(model.date||todayStr()).getDate(),
        active:true, createdAt:Date.now()
      };
      if(model.type==="transfer"){ rule.toAccountId=model.toAccountId; rule.tagIds=[]; }
      else { rule.categoryId=model.categoryId||null; rule.projectId=model.projectId||null; rule.tagIds=[...model.tagIds]; rule.cardId=model.cardId||null; }
      S.recurring=S.recurring||[]; S.recurring.push(rule);
      processRecurring();
      save(); closeSheet(); render();
      toast(`已設定週期性記帳（${FREQ_LABEL[rule.frequency]||rule.frequency}${count?`，共${count}次`:'，無期限'}）`);
      return;
    }
    const rec={ id:editing?editing.id:uid(), type:model.type, amount:Math.round(amt*100)/100, accountId:model.accountId, date:model.date||todayStr(), note:model.note, tagIds:model.type==="transfer"?[]:[...model.tagIds], ts:editing?editing.ts:Date.now() };
    if(model.type==="transfer") rec.toAccountId=model.toAccountId;
    else { rec.categoryId=model.categoryId||null; rec.projectId=model.projectId||null; rec.cardId=model.cardId||null; }
    if(editing){ const i=S.transactions.findIndex(t=>t.id===editing.id); S.transactions[i]=rec; } else S.transactions.push(rec);
    save(); closeSheet(); render(); toast(editing?"已更新":"已記錄");
  }
}
function safeCalc(e){
  if(!e) return "0"; let s=e.replace(/[×]/g,"*").replace(/[÷]/g,"/");
  if(/[+\-*/.]$/.test(s)) s=s.slice(0,-1);
  if(!/^[-0-9+*/.() ]*$/.test(s)) return "0";
  try{ const v=Function('"use strict";return ('+(s||"0")+')')(); return (isFinite(v)?(Math.round(v*100)/100):0).toString(); }catch(_){ return "0"; }
}

/* ============================================================ Sheet / toast */
function openSheet(title,html,opts){
  opts=opts||{};
  $("#sheetTitle").textContent=title; $("#sheetBody").innerHTML=html;
  const old=document.getElementById("sheetAction"); if(old) old.remove();
  document.querySelectorAll(".sheet-extra-action").forEach(el=>el.remove());
  const headRight=document.getElementById("sheetHeadRight");
  if(Array.isArray(opts.extraActions)){
    opts.extraActions.forEach(ea=>{
      const btn=document.createElement("button");
      btn.className="icon-btn sheet-extra-action"; btn.textContent=ea.icon;
      btn.title=ea.label||"";
      if(ea.danger) btn.style.color="var(--expense)";
      btn.onclick=()=>ea.onClick&&ea.onClick();
      headRight.insertBefore(btn, $("#sheetClose"));
    });
  }
  if(opts.actionLabel){
    const btn=document.createElement("button");
    btn.id="sheetAction"; btn.className="sheet-action"; btn.textContent=opts.actionLabel;
    btn.onclick=()=>opts.onAction&&opts.onAction();
    headRight.insertBefore(btn, $("#sheetClose"));
  }
  $("#sheet").classList.add("show"); $("#scrim").classList.add("show"); $("#sheetBody").scrollTop=0;
}
function closeSheet(){ $("#sheet").classList.remove("show"); $("#scrim").classList.remove("show"); }
$("#scrim").onclick=closeSheet; $("#sheetClose").onclick=closeSheet;
let toastTimer;
function toast(msg){ const el=$("#toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove("show"),1800); }

/* boot */
processRecurring();
processCardAutoPay();
render();
window.addEventListener("resize",()=>{ if(TAB==="accounts") drawAssetChart(); if(TAB==="report") renderReport(); });
</script>

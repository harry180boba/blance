        const basicLabel=r.isBasic?` <span class="tag-mini" style="background:var(--income);color:#fff;font-size:8px;padding:1px 5px">基本</span>`:"";
        const condLabel=(r.minSpendPerTx>0||r.maxRewardPerMonth>0||r.maxRewardPerTx>0)?` <span class="muted" style="font-size:9.5px">※</span>`:"";
        const boundAcc=r.rewardAccountId&&acc(r.rewardAccountId)?acc(r.rewardAccountId):null;
        const accLabel=boundAcc?` <span class="tag-mini" style="color:var(--transfer)">${boundAcc.icon}</span>`:"";
        return `<button class="pick ${isOn?'on':''}" data-rw="${r.id}"${r.note?` title="${escapeHtml(r.note)}"`:""}>
          ${escapeHtml(r.name)} <span class="tag-mini" style="color:var(--income)">${r.rate}%</span>${basicLabel}${exLabel}${condLabel}${accLabel}</button>`;
      }).join("")}</div>
      <div id="rewardInfo" style="margin-top:6px"></div></div>`;
    wrap.querySelectorAll("[data-rw]").forEach(b=>b.onclick=()=>{
      const rid=b.dataset.rw;
      const idx2=model.selectedRewardIds.indexOf(rid);
      if(idx2>=0) model.selectedRewardIds.splice(idx2,1); else model.selectedRewardIds.push(rid);
      b.classList.toggle("on");
      updateRewardDisplay();
    });
    updateRewardDisplay();
  }

  function updateRewardDisplay(){
    const wrap=$("#rewardInfo"); if(!wrap) return;
    const a=acc(model.accountId); const card=a?cardOf(a,model.cardId):null;
    if(!card||!model.selectedRewardIds.length){ wrap.innerHTML=""; return; }
    const sc2=getSurchargeResult();
    const baseForCalc=sc2.parts.length?sc2.final:getBaseAmount();
    let lines=[];
    model.selectedRewardIds.forEach(rid=>{
      const est=computeRewardEstimate(card, rid, baseForCalc, model.accountId);
      if(!est.rule) return;
      const ra=est.rule.rewardAccountId&&acc(est.rule.rewardAccountId)?acc(est.rule.rewardAccountId):null;
      const raLabel=ra?" → "+escapeHtml(ra.name):"";
      if(est.amount===0&&est.note){ lines.push(`<span style="color:var(--adjust)">${escapeHtml(est.rule.name)}: ${escapeHtml(est.note)}</span>`); return; }
      lines.push(`${escapeHtml(est.rule.name)} ${est.rule.rate}% ≈ <b>+${moneyCur(est.amount,currentCurCode())}</b>${raLabel}`);
    });
    if(!lines.length){ wrap.innerHTML=""; return; }
    wrap.innerHTML=`<div class="muted" style="font-size:11.5px;color:var(--income)">${lines.join("<br>")}</div>`;
  }
  function readInputs(){ const g=id=>document.getElementById(id);
    if(g("acc")) model.accountId=g("acc").value; if(g("fAcc")) model.accountId=g("fAcc").value; if(g("tAcc")) model.toAccountId=g("tAcc").value;
    if(g("prj")) model.projectId=g("prj").value||null; if(g("txDate")) model.date=g("txDate").value; if(g("txNote")) model.note=g("txNote").value.trim();
    if(g("recCount")) model.recCount=parseInt(g("recCount").value)||1;
  }
  function applyNoteSuggestion(){
    if(editing||model.type==="transfer") return;
    const noteEl=$("#txNote"); if(!noteEl) return;
    const match=findNoteMatch(noteEl.value, model.type); if(!match) return;
    let changed=false;
    if(match.categoryId && match.categoryId!==model.categoryId){
      model.categoryId=match.categoryId;
      document.querySelectorAll("#sheetBody [data-cat]").forEach(b=>b.classList.toggle("on", b.dataset.cat===match.categoryId));
      changed=true;
    }
    if(match.accountId && match.accountId!==model.accountId){
      model.accountId=match.accountId; userPickedAccount=true;
      const sel=document.getElementById("acc"); if(sel) sel.value=match.accountId;
      ensureCardDefault(); refreshCardPicker(); refreshTagPicker(); refreshRewardPicker();
      updateCurDisplay();
      changed=true;
    }
    if(Array.isArray(match.tagIds) && match.tagIds.length){
      model.tagIds=[...match.tagIds];
      document.querySelectorAll("#sheetBody [data-tg]").forEach(b=>b.classList.toggle("on", model.tagIds.includes(b.dataset.tg)));
      changed=true;
    }
    if(match.projectId){
      model.projectId=match.projectId;
      const sel=document.getElementById("prj"); if(sel) sel.value=match.projectId;
      changed=true;
    }
    if(changed) toast(`已套用「${noteEl.value.trim()}」常用設定`);
  }
  function press(k){
    const el=$("#amtInput"); if(!el) return; let v=el.value;
    if(k==="back") v=v.slice(0,-1);
    else if(k==="."){ if(!/[.][^+\-*/]*$/.test(v)) v+=v===""?"0.":"."; }
    else if("+-*/".includes(k)){ if(v===""){ if(k==="-") v="-"; } else if("+-*/".includes(v.slice(-1))) v=v.slice(0,-1)+k; else v+=k; }
    else v+=k;
    el.value=v; el.focus(); const L=v.length; el.setSelectionRange&&el.setSelectionRange(L,L); updateAmt();
  }
  function currentCurCode(){ const a=acc(model.accountId); return a?accCurrency(a):"TWD"; }
  function refreshCardPicker(){
    const wrap=$("#cardPickWrap"); if(!wrap) return;
    const a=acc(model.accountId); const cds=(a&&a.cards)||[];
    if(!cds.length){ wrap.style.display="none"; wrap.innerHTML=""; return; }
    wrap.style.display="";
    wrap.innerHTML=`<span class="lb">卡別</span><select class="input" id="cardSel">${cds.map(c=>`<option value="${c.id}" ${model.cardId===c.id?"selected":""}>${escapeHtml(c.name)}</option>`).join("")}</select>`;
    const sel=$("#cardSel"); if(sel) sel.addEventListener("change",()=>{ model.cardId=sel.value; model.selectedRewardIds=[]; refreshTagPicker(); refreshRewardPicker(); });
  }
  function updateCurDisplay(){
    const cs=$("#curSym"); if(cs) cs.textContent=currencySymbol(currentCurCode());
    updateAmt();
  }
  function getBaseAmount(){ const el=$("#amtInput"); return el? (parseFloat(safeCalc(el.value))||0):0; }
  function getForeignRate(){ const a=acc(model.accountId); return (a&&a.foreignFeeRate>0)? a.foreignFeeRate:0; }
  function getSurchargeResult(){
    const base=getBaseAmount();
    return computeSurcharges(base,{
      service: model.type==="expense" && !!model.surchargeService,
      foreign: model.type==="expense" && !!model.surchargeForeign,
      foreignRate: getForeignRate()
    });
  }
  function getFinalAmount(){ const sc=getSurchargeResult(); return sc.parts.length? sc.final : Math.round(getBaseAmount()*100)/100; }
  function updateSurchargeDisplay(){
    const wrap=$("#surchargeInfo"); if(!wrap) return;
    const sc=getSurchargeResult();
    if(!sc.parts.length){ wrap.innerHTML=""; return; }
    const cur=currentCurCode();
    wrap.innerHTML=`<div class="muted" style="font-size:11.5px;margin-top:6px">原始 <b style="color:var(--ink)">${moneyCur(getBaseAmount(),cur)}</b> ${sc.parts.map(p=>`· <span style="color:var(--expense)">+${moneyCur(p.amount,cur)} ${p.label}</span>`).join(" ")} → 儲存後各自拆成獨立交易，合計 <b style="color:var(--ink)">${moneyCur(sc.final,cur)}</b></div>`;
  }
  function updateAmt(){
    const el=$("#amtInput"),ev=$("#exprView"); if(!el||!ev) return;
    const v=el.value;
    ev.textContent=(v&&/[+\-*/]/.test(v))? "= "+moneyCur(parseFloat(safeCalc(v))||0, currentCurCode()) : "";
    updateSurchargeDisplay();
    updateRewardDisplay();
  }  function commit(){
    readInputs();
    const base=getBaseAmount();
    if(!base||base<=0){ toast("請輸入金額"); return; }
    if(model.type!=="transfer"){
      const curAcc=acc(model.accountId); const curCards=(curAcc&&curAcc.cards)||[];
      if(curCards.length && !curCards.some(c=>c.id===model.cardId)){ toast("這個帳戶有多個卡別，請選擇是哪一張"); return; }
    }
    if(model.accountId){ S.settings=S.settings||{}; S.settings.lastAccountId=model.accountId; }
    if(model.type==="transfer"){
      if(model.accountId===model.toAccountId){ toast("轉出與轉入帳戶不能相同"); return; }
      const fa=acc(model.accountId), ta=acc(model.toAccountId);
      if(fa && ta && accCurrency(fa)!==accCurrency(ta)){ toast("不同幣別帳戶間目前不支援直接轉帳換匯，請改用調整餘額分別記錄"); return; }
    }
    const sc = model.type==="expense"? getSurchargeResult() : {parts:[],surchargeTotal:0,final:Math.round(base*100)/100};
    // New: main amount = base only; surcharge parts become linked transactions
    const mainAmt = Math.round(base*100)/100;
    let finalTagIds = model.type==="transfer"? [] : [...model.tagIds];

    let rewardEstimates=[];
    if(model.type==="expense"){
      const a=acc(model.accountId); const card=a?cardOf(a,model.cardId):null;
      if(card && model.selectedRewardIds && model.selectedRewardIds.length){
        model.selectedRewardIds.forEach(rid=>{
          const est=computeRewardEstimate(card, rid, sc.parts.length? sc.final : mainAmt, model.accountId);
          if(est.rule && est.amount>0){
            const raId=est.rule.rewardAccountId||(S.settings&&S.settings.defaultRewardAccountId)||null;
            rewardEstimates.push({ruleId:rid, amount:est.amount, rate:est.rate, accountId:raId});
          }
        });
      }
    }

    if(!editing && model.recurring){
      const count = model.recEndMode==="count"? Math.max(1,parseInt(model.recCount)||1) : null;
      const rule={
        id:uid(), type:model.type, amount:mainAmt,
        accountId:model.accountId, note:model.note,
        frequency:model.recFreq||"monthly", endMode:model.recEndMode||"count",
        count, generatedCount:0, nextDate:model.date||todayStr(), dayOfMonth:parseD(model.date||todayStr()).getDate(),
        active:true, createdAt:Date.now()
      };
      if(model.type==="transfer"){ rule.toAccountId=model.toAccountId; rule.tagIds=[]; }
      else { rule.categoryId=model.categoryId||null; rule.projectId=model.projectId||null; rule.tagIds=finalTagIds; rule.cardId=model.cardId||null; }
      S.recurring=S.recurring||[]; S.recurring.push(rule);
      processRecurring();
      save(); closeSheet(); render();
      toast(`已設定週期性記帳（${FREQ_LABEL[rule.frequency]||rule.frequency}${count?`，共${count}次`:'，無期限'}）`);
      return;
    }

    // ── Editing: remove old linked transactions first ──
    if(editing){
      const oldLinked=Array.isArray(editing.linkedTxnIds)?editing.linkedTxnIds:[];
      S.transactions=S.transactions.filter(t=>!oldLinked.includes(t.id));
    }

    const mainId = editing? editing.id : uid();
    const txDate = model.date||todayStr();
    const linkedIds=[];

    // ── Surcharge linked transactions ──
    if(model.type==="expense" && sc.parts.length){
      sc.parts.forEach(p=>{
        const scId=uid();
        const tagName = p.type==="service"? "服务费" : "國外交易手續費";
        const scTag=ensureSystemTag(p.type==="service"?"服務費":"國外交易手續費", p.type==="service"?"#F59E0B":"#2E8FF0");
        const scRec={
          id:scId, type:"expense", subType:"surcharge",
          amount:p.amount, accountId:model.accountId,
          date:txDate, note:`${p.label}（${model.note||""}）`.replace(/（）$/,""),
          tagIds:[scTag.id], ts:Date.now(), linkedTxnIds:[mainId],
          categoryId:model.categoryId||null, cardId:model.cardId||null,
          projectId:model.projectId||null
        };
        S.transactions.push(scRec);
        linkedIds.push(scId);
      });
    }

    // ── Reward linked transactions ──
    rewardEstimates.forEach(re=>{
      if(!re.accountId || !acc(re.accountId)) return;
      const card3=cardOf(acc(model.accountId),model.cardId);
      const rule=card3?rewardRulesForCard(card3).find(r=>r.id===re.ruleId):null;
      const isMonthly=rule&&(rule.calcBasis||"monthly")==="monthly";

      if(isMonthly && model.accountId){
        // ── Monthly mode: find existing cycle reward txn for this rule, update or create ──
        const a3=acc(model.accountId);
        const cy3=a3?listRecentCycles(a3,1):[];
        const cyS=cy3.length?dstr(cy3[0].start):"";
        const cyE=cy3.length?dstr(cy3[0].end):"";
        // Find existing single reward txn for this rule in this cycle
        const existing=cyS?S.transactions.find(t=>
          t.subType==="reward" && t._ruleId===re.ruleId &&
          t.date>=cyS && t.date<=cyE
        ):null;
        if(existing){
          // Update amount to new cycle total
          const totalCycleReward=re.amount + ruleRewardEarned(model.accountId, re.ruleId, cyS, cyE);
          const cap2=parseFloat(rule.maxRewardPerMonth)||0;
          existing.amount=cap2>0?Math.min(totalCycleReward,cap2):totalCycleReward;
          existing.note=`回饋（${rule.name}）：本期合計`;
          // Link both ways
          if(!existing.linkedTxnIds.includes(mainId)) existing.linkedTxnIds.push(mainId);
          linkedIds.push(existing.id);
        } else {
          // Create new single cycle reward txn
          const rwId=uid();
          const rwRec={
            id:rwId, type:"income", subType:"reward", _ruleId:re.ruleId,
            amount:re.amount, accountId:re.accountId,
            date:txDate, note:`回饋（${rule?rule.name:""}）：本期合計`,
            tagIds:[], ts:Date.now(), linkedTxnIds:[mainId],
            categoryId:null, cardId:null, projectId:null
          };
          S.transactions.push(rwRec);
          linkedIds.push(rwId);
        }
      } else {
        // ── Per-tx mode: create individual reward txn ──
        const rwId=uid();
        const rwRec={
          id:rwId, type:"income", subType:"reward",
          amount:re.amount, accountId:re.accountId,
          date:txDate, note:`回饋（${rule?rule.name:""}）：${model.note||cat(model.categoryId)?.name||"消費"}`,
          tagIds:[], ts:Date.now(), linkedTxnIds:[mainId],
          categoryId:null, cardId:null, projectId:null
        };
        S.transactions.push(rwRec);
        linkedIds.push(rwId);
      }
    });

    // ── Main transaction ──
    const rec={
      id:mainId, type:model.type, amount:mainAmt,
      accountId:model.accountId, date:txDate,
      note:model.note, tagIds:finalTagIds,
      ts:editing?editing.ts:Date.now(),
      linkedTxnIds:linkedIds
    };
    if(model.type==="transfer") rec.toAccountId=model.toAccountId;
    else {
      rec.categoryId=model.categoryId||null; rec.projectId=model.projectId||null; rec.cardId=model.cardId||null;
      rec.baseAmount=base; rec.surcharges=sc.parts||[];
      rec.selectedRewardIds = model.selectedRewardIds||[];
      rec.rewardAmount=rewardEstimates.reduce((s,e)=>s+e.amount,0);
      rec.rewardRate=rewardEstimates.length?rewardEstimates[0].rate:0;
    }

    if(editing){ const i=S.transactions.findIndex(t=>t.id===editing.id); if(i>=0) S.transactions[i]=rec; else S.transactions.push(rec); }
    else S.transactions.push(rec);
    save(); closeSheet(); render(); toast(editing?"已更新":"已記錄");
  }
}
function safeCalc(e){
  if(!e) return "0"; let s=e.replace(/[×]/g,"*").replace(/[÷]/g,"/");
  if(/[+\-*/.]$/.test(s)) s=s.slice(0,-1);
  if(!/^[-0-9+*/.() ]*$/.test(s)) return "0";
  try{ const v=Function('"use strict";return ('+(s||"0")+')')(); return (isFinite(v)?(Math.round(v*100)/100):0).toString(); }catch(_){ return "0"; }
}

/* ============================================================ Sheet / toast */
function openSheet(title,html,opts){
  opts=opts||{};
  $("#sheetTitle").textContent=title; $("#sheetBody").innerHTML=html;
  const old=document.getElementById("sheetAction"); if(old) old.remove();
  document.querySelectorAll(".sheet-extra-action").forEach(el=>el.remove());
  const headRight=document.getElementById("sheetHeadRight");
  if(Array.isArray(opts.extraActions)){
    opts.extraActions.forEach(ea=>{
      const btn=document.createElement("button");
      btn.className="icon-btn sheet-extra-action"; btn.textContent=ea.icon;
      btn.title=ea.label||"";
      if(ea.danger) btn.style.color="var(--expense)";
      btn.onclick=()=>ea.onClick&&ea.onClick();
      headRight.insertBefore(btn, $("#sheetClose"));
    });
  }
  if(opts.actionLabel){
    const btn=document.createElement("button");
    btn.id="sheetAction"; btn.className="sheet-action"; btn.textContent=opts.actionLabel;
    btn.onclick=()=>opts.onAction&&opts.onAction();
    headRight.insertBefore(btn, $("#sheetClose"));
  }
  $("#sheet").classList.add("show"); $("#scrim").classList.add("show"); $("#sheetBody").scrollTop=0;
}
function closeSheet(){ $("#sheet").classList.remove("show"); $("#scrim").classList.remove("show"); }
$("#scrim").onclick=closeSheet; $("#sheetClose").onclick=closeSheet;
let toastTimer;
function toast(msg){ const el=$("#toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove("show"),1800); }

/* boot */
processRecurring();
processCardAutoPay();
render();
window.addEventListener("resize",()=>{ if(TAB==="accounts") drawAssetChart(); if(TAB==="report") renderReport(); });
</script>

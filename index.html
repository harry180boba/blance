<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>記帳本</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#fff;--bg2:#f5f5f5;--bg3:#ebebeb;
  --text:#111;--text2:#555;--text3:#999;
  --border:rgba(0,0,0,.12);--border2:rgba(0,0,0,.22);
  --blue:#185FA5;--blue-bg:#E6F1FB;--blue-text:#0C447C;
  --green:#0F6E56;--green-bg:#E1F5EE;--green-mid:#1D9E75;
  --red:#993C1D;--red-mid:#D85A30;--red-bg:#FAECE7;
  --amber:#BA7517;--r-md:8px;--r-lg:12px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1a1a1a;--bg2:#252525;--bg3:#303030;
  --text:#f0f0f0;--text2:#aaa;--text3:#666;
  --border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.22);
  --blue:#378ADD;--blue-bg:#0C2A44;--blue-text:#85B7EB;
  --green:#1D9E75;--green-bg:#083028;--green-mid:#5DCAA5;
  --red:#D85A30;--red-mid:#F0997B;--red-bg:#3A1810;
}}
body{background:var(--bg3);font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;display:flex;justify-content:center;min-height:100vh}
.app{width:100%;max-width:430px;background:var(--bg);display:flex;flex-direction:column;min-height:100vh;position:relative;overflow:hidden}
.screen{display:none;flex-direction:column;flex:1;overflow:hidden}
.screen.active{display:flex}

/* AUTH */
.auth-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px}
.auth-logo{font-size:48px;margin-bottom:8px}
.auth-title{font-size:24px;font-weight:700;color:var(--text);margin-bottom:4px}
.auth-sub{font-size:14px;color:var(--text3);margin-bottom:32px}
.auth-tabs{display:flex;background:var(--bg2);border-radius:var(--r-md);padding:3px;gap:3px;margin-bottom:20px;width:100%}
.auth-tab{flex:1;padding:8px;border:none;border-radius:7px;font-size:14px;font-weight:500;cursor:pointer;background:none;color:var(--text2);font-family:inherit;transition:all .15s}
.auth-tab.on{background:var(--bg);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.auth-form{width:100%;display:flex;flex-direction:column;gap:10px}
.auth-input{background:var(--bg2);border:0.5px solid var(--border2);border-radius:var(--r-md);padding:12px 14px;font-size:15px;color:var(--text);font-family:inherit;outline:none;width:100%}
.auth-input:focus{border-color:var(--blue)}
.auth-btn{background:var(--blue);color:#fff;border:none;border-radius:var(--r-md);padding:13px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.auth-btn:disabled{opacity:.5;cursor:not-allowed}
.auth-err{font-size:13px;color:var(--red-mid);text-align:center;min-height:18px}

/* HEADER */
.hdr{padding:14px 16px 10px;border-bottom:0.5px solid var(--border);flex-shrink:0;background:var(--bg)}
.hdr-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hdr h2{font-size:17px;font-weight:600;color:var(--text)}
.back-btn{background:none;border:none;cursor:pointer;color:var(--text2);font-size:22px;padding:2px;line-height:1}
.save-btn{background:var(--blue);color:#fff;border:none;border-radius:var(--r-md);padding:7px 16px;font-size:13px;font-weight:600;cursor:pointer}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--text2);font-size:13px;display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:var(--r-md)}
.icon-btn:hover{background:var(--bg2)}
.icon-btn i{font-size:16px}

/* BOTTOM NAV */
.bnav{display:flex;background:var(--bg);border-top:0.5px solid var(--border);padding:6px 0;flex-shrink:0}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;padding:4px 0;color:var(--text3);font-size:10px;font-family:inherit}
.nb i{font-size:22px}
.nb.on{color:var(--blue)}
.fab{width:46px;height:46px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;margin-top:-16px}

/* SCROLL */
.scroll{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}

/* HOME */
.net-wrap{padding:20px 16px 10px;text-align:center}
.net-lbl{font-size:12px;color:var(--text3);margin-bottom:4px}
.net-val{font-size:36px;font-weight:700;color:var(--text);letter-spacing:-1px}
.period-row{display:flex;gap:5px;padding:0 16px 10px}
.pt{flex:1;padding:6px 0;border:0.5px solid var(--border2);border-radius:var(--r-md);background:none;font-size:12px;cursor:pointer;color:var(--text2);font-family:inherit;transition:all .15s}
.pt.on{background:var(--blue);color:#fff;border-color:var(--blue)}
/* ① y軸 + chart */
.chart-area{margin:0 16px 4px;display:flex;gap:0;align-items:stretch}
.chart-yaxis{display:flex;flex-direction:column;justify-content:space-between;padding:4px 4px 14px 0;flex-shrink:0;width:44px;align-items:flex-end}
.chart-yaxis span{font-size:8.5px;color:var(--text3);white-space:nowrap}
.chart-box{flex:1;height:96px}
.chart-box svg{width:100%;height:100%}
.period-hint{padding:2px 16px 12px;font-size:11px;color:var(--text3)}
.sdiv{height:0.5px;background:var(--border);margin:2px 14px 12px}
.acct-wrap{padding:0 14px 80px}
.acct-wrap-title{font-size:12px;font-weight:600;color:var(--text2);padding:0 2px 8px}
.ag{margin-bottom:8px;border:0.5px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.ag-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;cursor:pointer;background:var(--bg2);user-select:none}
.ag-hdr:hover{background:var(--bg3)}
.ag-left{display:flex;align-items:center;gap:10px}
.ag-ico{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px}
.ag-name{font-size:14px;font-weight:600;color:var(--text)}
.ag-cnt{font-size:10px;color:var(--text3);margin-left:4px}
.ag-right{display:flex;align-items:center;gap:7px}
.ag-bal{font-size:14px;font-weight:600}
.ag-chev{font-size:14px;color:var(--text3);transition:transform .2s}
.ag-chev.open{transform:rotate(180deg)}
.ag-body{display:none;border-top:0.5px solid var(--border)}
.ag-body.open{display:block}
.asub{display:flex;align-items:center;justify-content:space-between;padding:9px 13px 9px 22px;border-bottom:0.5px solid var(--border);cursor:pointer}
.asub:last-of-type{border-bottom:none}
.asub:hover{background:var(--bg2)}
.asub-name{font-size:13px;color:var(--text2)}
.asub-bal{font-size:13px;font-weight:600}
.asub-add{display:flex;align-items:center;gap:6px;padding:8px 13px 8px 22px;color:var(--text3);font-size:12px;background:none;border:none;cursor:pointer;font-family:inherit;width:100%;text-align:left}
.asub-add:hover{background:var(--bg2)}

/* CAL */
.cal-hdr-row{display:flex;align-items:center;justify-content:space-between}
.mtitle{font-size:17px;font-weight:600;color:var(--text);cursor:pointer;padding:2px 8px;border-radius:6px;user-select:none}
.mtitle:hover{background:var(--bg2)}
.mnav-btn{background:none;border:none;cursor:pointer;color:var(--text2);font-size:16px;padding:4px;border-radius:6px;line-height:1}
.mnav-btn:hover{background:var(--bg2)}
.sum-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:8px 14px}
.sm{padding:7px 10px;border-radius:var(--r-md);background:var(--bg2)}
.sm-l{font-size:10px;color:var(--text3);margin-bottom:3px}
.sm-v{font-size:13px;font-weight:600}
.cal-outer{overflow:hidden;touch-action:pan-y;flex-shrink:0}
.cal-track{display:flex;transition:transform .3s cubic-bezier(.4,0,.2,1)}
.cal-page{flex-shrink:0;width:100%;padding:0 12px 4px}
.wdays{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:3px}
.wdays span{text-align:center;font-size:11px;color:var(--text3);padding:3px 0}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.cc{display:flex;flex-direction:column;align-items:center;padding:3px 1px;cursor:pointer;border-radius:7px;min-height:44px}
.cc:hover{background:var(--bg2)}
.cc.om .dn{opacity:.22}
.cc.td .dn{background:var(--blue);color:#fff;border-radius:50%}
.cc.sel{background:var(--blue-bg)}
.cc.sel .dn{color:var(--blue-text)}
.cc.td.sel .dn{background:var(--blue);color:#fff}
.dn{font-size:12px;font-weight:500;color:var(--text);width:22px;height:22px;display:flex;align-items:center;justify-content:center;margin-bottom:1px}
.ddots{display:flex;gap:2px;justify-content:center;min-height:6px}
.dot{width:4px;height:4px;border-radius:50%}
.dot.e{background:var(--red-mid)}.dot.i{background:var(--green-mid)}
.damt{font-size:8px;margin-top:1px;white-space:nowrap}
.divline{height:0.5px;background:var(--border);margin:3px 12px}
/* ② 明細滾動 */
.txp{overflow-y:auto;flex:1;padding:0 12px 6px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.tx-dh{display:flex;justify-content:space-between;align-items:center;padding:8px 0 5px;position:sticky;top:0;background:var(--bg);z-index:1}
.tx-dh .dl{font-size:12px;font-weight:600;color:var(--text2)}
.tx-dh .ds{font-size:11px;color:var(--text3)}
.txi{display:flex;align-items:center;gap:9px;padding:9px 10px;background:var(--bg2);border-radius:var(--r-md);margin-bottom:5px;cursor:pointer}
.txi:hover{opacity:.78}
.txi-ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.txi-info{flex:1;min-width:0}
.txi-name{font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txi-sub{font-size:11px;color:var(--text3);margin-top:1px;display:flex;gap:4px;flex-wrap:wrap}
.txi-amt{font-size:13px;font-weight:600;flex-shrink:0}
.txi-amt.i{color:var(--green)}.txi-amt.e{color:var(--red)}
.tag-pill{display:inline-block;padding:1px 6px;background:var(--blue-bg);color:var(--blue-text);border-radius:10px;font-size:10px}
.empty{text-align:center;padding:28px 0;color:var(--text3);font-size:13px;line-height:2.5}

/* ADD */
.type-sw{display:flex;margin:10px 14px 9px;background:var(--bg2);border-radius:var(--r-md);padding:3px;gap:3px}
.tbtn{flex:1;padding:8px;border:none;border-radius:7px;font-size:14px;font-weight:600;cursor:pointer;background:none;color:var(--text2);font-family:inherit;transition:all .15s}
.tbtn.ae{background:var(--red);color:#fff}
.tbtn.ai{background:var(--green);color:#fff}
.amt-wrap{margin:0 14px 12px;display:flex;align-items:center;gap:6px;border-bottom:2px solid var(--border2);padding-bottom:10px}
.amt-cur{font-size:18px;color:var(--text3);font-weight:500}
/* ① 移除 spinner */
.amt-input{flex:1;background:none;border:none;outline:none;font-size:40px;font-weight:700;color:var(--text);font-family:inherit;min-width:0;letter-spacing:-1px;-moz-appearance:textfield}
.amt-input::-webkit-outer-spin-button,.amt-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ffields{padding:0 14px;display:flex;flex-direction:column;gap:7px}
.frow{display:flex;align-items:center;gap:10px;background:var(--bg2);border-radius:var(--r-md);padding:10px 12px}
.frow i{font-size:17px;color:var(--text3);width:17px;text-align:center;flex-shrink:0}
.frow input,.frow select{background:none;border:none;outline:none;font-size:14px;color:var(--text);flex:1;font-family:inherit;cursor:pointer;min-width:0}
.frow select option{background:var(--bg)}
/* tag input */
.tag-input-wrap{display:flex;flex-wrap:wrap;gap:5px;align-items:center;flex:1}
.tag-chip{display:flex;align-items:center;gap:3px;padding:3px 8px;background:var(--blue-bg);color:var(--blue-text);border-radius:12px;font-size:12px}
.tag-chip button{background:none;border:none;cursor:pointer;color:var(--blue-text);font-size:14px;line-height:1;padding:0}
.tag-text-input{background:none;border:none;outline:none;font-size:13px;color:var(--text);font-family:inherit;min-width:80px;flex:1}
.cat-sec{padding:10px 14px 4px}
.cat-lbl{font-size:11px;color:var(--text3);margin-bottom:6px;font-weight:500}
/* ③④ 帳戶選擇 — 橫向捲動卡片 */
.acct-pick-wrap{padding:0 14px;margin-bottom:8px}
.acct-pick-lbl{font-size:11px;color:var(--text3);margin-bottom:6px;font-weight:500}
.acct-pick-scroll{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.acct-pick-scroll::-webkit-scrollbar{display:none}
.acct-card{flex-shrink:0;width:110px;padding:9px 10px;border-radius:var(--r-md);border:1.5px solid var(--border);cursor:pointer;transition:all .15s;background:var(--bg2);position:relative}
.acct-card.sel{border-color:var(--blue);background:var(--blue-bg)}
.acct-card-icon{font-size:18px;margin-bottom:3px}
.acct-card-name{font-size:11px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct-card-bal{font-size:10px;color:var(--text3);margin-top:1px}
/* ④ 推薦 badge */
.acct-card-badge{position:absolute;top:5px;right:6px;font-size:9px;background:var(--amber);color:#fff;padding:1px 5px;border-radius:8px}
/* ⑦ 分類排序 */
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ci{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 3px;border-radius:var(--r-md);cursor:pointer;border:1.5px solid transparent;position:relative}
.ci:hover{background:var(--bg2)}
.ci.sel{border-color:var(--blue);background:var(--blue-bg)}
.ci.sel .cn{color:var(--blue)}
.ci-freq{position:absolute;top:3px;right:4px;font-size:8px;color:var(--text3)}
.cico{font-size:20px}.cn{font-size:10px;color:var(--text2);text-align:center}

/* CHART SCREEN */
.chart-mnav{display:flex;align-items:center;gap:4px}
.chart-mnav button{background:none;border:none;cursor:pointer;color:var(--text2);padding:4px;border-radius:6px;font-size:16px;line-height:1}
.chart-mnav button:hover{background:var(--bg2)}
.chart-mlbl{font-size:14px;font-weight:600;color:var(--text);min-width:68px;text-align:center}
/* ⑧ 統計 filter bar */
.filter-bar{display:flex;gap:5px;padding:8px 14px 2px;overflow-x:auto;scrollbar-width:none;flex-wrap:wrap}
.filter-bar::-webkit-scrollbar{display:none}
.fb{padding:5px 11px;border-radius:20px;border:0.5px solid var(--border2);background:none;font-size:12px;cursor:pointer;color:var(--text2);font-family:inherit;white-space:nowrap;transition:all .15s}
.fb.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.fb.tag-fb{background:var(--blue-bg);color:var(--blue-text);border-color:var(--blue-bg)}
.fb.tag-fb.on{background:var(--blue);color:#fff}

/* SETTINGS */
.setting-section-label{font-size:11px;color:var(--text3);margin-bottom:8px;font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:12px 13px;background:var(--bg2);border-radius:var(--r-md);margin-bottom:7px;cursor:pointer}
.setting-row:hover{background:var(--bg3)}
.setting-row-left{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--text)}
.setting-row-left i{font-size:18px;color:var(--text2)}

/* MODAL */
.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:500}
.modal-box{width:100%;max-width:430px;background:var(--bg);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:16px;max-height:88vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:600;color:var(--text);text-align:center;margin-bottom:14px}
.modal-cancel{width:100%;margin-top:10px;padding:12px;border:none;border-radius:var(--r-md);background:var(--bg2);font-size:14px;cursor:pointer;color:var(--text2);font-family:inherit;font-weight:500}
.mpick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px}
.mpick{padding:9px 4px;border:0.5px solid var(--border2);border-radius:var(--r-md);background:none;font-size:13px;cursor:pointer;color:var(--text);font-family:inherit}
.mpick:hover{background:var(--bg2)}
.mpick.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.mform{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.mform label{font-size:11px;color:var(--text3);font-weight:500}
.mform input,.mform select{background:var(--bg2);border:0.5px solid var(--border2);border-radius:var(--r-md);padding:10px 12px;font-size:14px;color:var(--text);font-family:inherit;outline:none;width:100%}
.mform input:focus{border-color:var(--blue)}
.mform input[type=number]{-moz-appearance:textfield}
.mform input[type=number]::-webkit-outer-spin-button,.mform input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
.mform-submit{background:var(--blue);color:#fff;border:none;border-radius:var(--r-md);padding:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:4px}
.mform-del{background:none;color:var(--red);border:none;font-size:13px;cursor:pointer;font-family:inherit;padding:10px;display:flex;align-items:center;justify-content:center;gap:6px}
.atype-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.atype-btn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border:0.5px solid var(--border2);border-radius:var(--r-md);background:none;cursor:pointer;font-family:inherit}
.atype-btn:hover{background:var(--bg2)}
.atype-btn.on{border-color:var(--blue);background:var(--blue-bg)}
.atype-btn.on span{color:var(--blue)}
.atype-btn span{font-size:11px;color:var(--text2)}
.atype-btn .atico{font-size:20px}

/* LEDGER SCREEN */
.ledger-search{padding:10px 14px 6px;display:flex;gap:8px}
.ledger-search input{flex:1;background:var(--bg2);border:0.5px solid var(--border2);border-radius:var(--r-md);padding:9px 13px;font-size:14px;color:var(--text);outline:none;font-family:inherit}
.ledger-search input:focus{border-color:var(--blue)}
.lfilter-bar{display:flex;gap:5px;padding:0 14px 8px;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
.lfilter-bar::-webkit-scrollbar{display:none}
.lfb{padding:5px 11px;border-radius:20px;border:0.5px solid var(--border2);background:none;font-size:12px;cursor:pointer;color:var(--text2);font-family:inherit;white-space:nowrap;flex-shrink:0;transition:all .15s}
.lfb.on{background:var(--blue);color:#fff;border-color:var(--blue)}

/* TX DETAIL MODAL */
.txd-amount{font-size:32px;font-weight:700;text-align:center;padding:12px 0 16px}
.txd-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:0.5px solid var(--border)}
.txd-row:last-child{border-bottom:none}
.txd-label{font-size:12px;color:var(--text3)}
.txd-value{font-size:14px;font-weight:500;color:var(--text);text-align:right;max-width:65%;word-break:break-all}
.mform-del-full{width:100%;margin-top:14px;padding:12px;border:none;border-radius:var(--r-md);background:var(--red-bg);color:var(--red-mid);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}

/* MANAGE TAGS */
.tag-manage-item{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:var(--bg2);border-radius:var(--r-md);margin-bottom:6px}
.tag-manage-del{background:none;border:none;cursor:pointer;color:var(--red-mid);font-size:20px;padding:2px 6px;line-height:1}
.tag-add-row{display:flex;gap:7px;margin-top:10px}
.tag-add-row input{flex:1;background:var(--bg2);border:0.5px solid var(--border2);border-radius:var(--r-md);padding:9px 12px;font-size:14px;color:var(--text);font-family:inherit;outline:none}
.tag-add-row input:focus{border-color:var(--blue)}
.tag-add-row button{padding:0 16px;border:none;border-radius:var(--r-md);background:var(--blue);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}

/* GUEST MODE */

<script>
const SUPA_URL='https://bzkujcwniocbrdgsqnra.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ6a3VqY3duaW9jYnJkZ3NxbnJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NzEzMTAsImV4cCI6MjA5NTE0NzMxMH0.tq5MIEFD7-DaGv8znAkasTqRmZMVXAfrwk7bHIqTPNk';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);

/* ── CONSTANTS ── */
const ECATS=[
  {id:'food',name:'餐飲',icon:'🍜'},{id:'transport',name:'交通',icon:'🚌'},
  {id:'shopping',name:'購物',icon:'🛍️'},{id:'entertainment',name:'娛樂',icon:'🎮'},

  {id:'investment',name:'投資',icon:'📈'},{id:'freelance',name:'接案',icon:'💻'},
  {id:'gift',name:'禮金',icon:'🎀'},{id:'other_i',name:'其他',icon:'💰'}
];
const ATYPES=[
  {id:'cash',name:'現金',icon:'💵',color:'#1D9E75'},
  {id:'bank',name:'銀行',icon:'🏦',color:'#185FA5'},
  {id:'credit',name:'信用卡',icon:'💳',color:'#993C1D'},
  {id:'invest',name:'投資',icon:'📈',color:'#BA7517'},
  {id:'ewallet',name:'電子錢包',icon:'📱',color:'#534AB7'},
  {id:'other',name:'其他',icon:'💼',color:'#888780'},
];
function at(id){return ATYPES.find(t=>t.id===id)||ATYPES[5];}
function cmap(t){const m={};(t==='expense'?ECATS:ICATS).forEach(c=>m[c.id]=c);return m;}

/* ── STATE ── */
let currentUser=null;
let guestMode=false;
let txs=[],accounts=[],globalTags=[];
let ledgerAcctFilter=null,ledgerTagFilter=null;
let detailTxId=null;

/* ── INDEXEDDB ── */
let idb=null;
function openIDB(){return new Promise((res,rej)=>{const r=indexedDB.open('moze_idb',1);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('accounts'))d.createObjectStore('accounts',{keyPath:'id'});if(!d.objectStoreNames.contains('transactions'))d.createObjectStore('transactions',{keyPath:'id'});if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'key'});};r.onsuccess=e=>{idb=e.target.result;res(idb);};r.onerror=()=>rej(r.error);});}
function idbAll(store){return new Promise((res,rej)=>{const t=idb.transaction(store,'readonly');const r=t.objectStore(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function idbPut(store,obj){return new Promise((res,rej)=>{const t=idb.transaction(store,'readwrite');const r=t.objectStore(store).put(obj);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});}
function idbDel(store,id){return new Promise((res,rej)=>{const t=idb.transaction(store,'readwrite');const r=t.objectStore(store).delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});}
function genId(){return 'g'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
async function saveGlobalTags(){if(guestMode&&idb)await idbPut('meta',{key:'globalTags',value:globalTags});}

/* ── UTILS (extra) ── */
let curY=new Date().getFullYear(),curM=new Date().getMonth();
let chartY=curY,chartM=curM;
let selDate=null,curType='expense',selCat='food',curPeriod='month';
let addTags=[];          // tags being added
let selectedAcctId=null;
let chartFilter={type:'expense',tag:null}; // ⑧

/* ── UTILS ── */
function fmt(n){return Math.round(n).toLocaleString();}
function fmtK(n){const v=Math.round(Math.abs(n));const s=n<0?'-':'';return s+(v>=10000?(v/1000).toFixed(0)+'k':v>=1000?(v/1000).toFixed(1)+'k':String(v));}
function fmtY(n){/* y-axis label */
  const v=Math.abs(n);
  if(v===0)return '0';
  if(v>=10000)return (n/10000).toFixed(0)+'萬';
  if(v>=1000)return (n/1000).toFixed(0)+'k';
  return String(Math.round(n));
}
function pad(n){return String(n).padStart(2,'0');}
function offM(y,m,d){let nm=m+d,ny=y;if(nm<0){nm=11;ny--;}if(nm>11){nm=0;ny++;}return{y:ny,m:nm};}
function showLoading(msg='載入中…'){hideLoading();const el=document.createElement('div');el.className='loading-overlay';el.id='loading-el';el.innerHTML='<div class="loading-box"><i class="ti ti-loader-2"></i>'+msg+'</div>';document.body.appendChild(el);}
function hideLoading(){const el=document.getElementById('loading-el');if(el)el.remove();}
function toast(msg){const el=document.getElementById('toast-el');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2400);}

/* ── AUTH ── */
let authMode='login';
function switchAuthTab(mode){
  authMode=mode;
  document.querySelectorAll('.auth-tab').forEach((b,i)=>b.classList.toggle('on',(i===0&&mode==='login')||(i===1&&mode==='register')));
  document.getElementById('auth-submit-btn').textContent=mode==='login'?'登入':'註冊帳號';
  document.getElementById('auth-err').textContent='';
}
async function doAuth(){
  const email=document.getElementById('auth-email').value.trim();
  const pw=document.getElementById('auth-pw').value;
  const errEl=document.getElementById('auth-err');
  const btn=document.getElementById('auth-submit-btn');
  if(!email||!pw){errEl.textContent='請輸入 Email 和密碼';return;}
  btn.disabled=true;btn.textContent='處理中…';errEl.textContent='';
  try{
    let res=authMode==='login'?await sb.auth.signInWithPassword({email,password:pw}):await sb.auth.signUp({email,password:pw});
    if(res.error)throw res.error;
    if(authMode==='register'&&!res.data.session){errEl.style.color='var(--green-mid)';errEl.textContent='確認信已寄出，請確認 Email 後登入';}
    else{currentUser=res.data.user;await onLogin();}
  }catch(e){errEl.style.color='var(--red-mid)';errEl.textContent=e.message||'發生錯誤';}
  finally{btn.disabled=false;btn.textContent=authMode==='login'?'登入':'註冊帳號';}
}
async function onLogin(){showLoading('同步中…');await loadAllData();hideLoading();document.getElementById('user-email-display').textContent=currentUser.email||'已登入';go('home');}
async function doLogout(){
  if(!confirm('確定登出 / 切換模式？'))return;
  if(!guestMode){try{await sb.auth.signOut();}catch(e){}}
  currentUser=null;guestMode=false;txs=[];accounts=[];globalTags=[];
  document.getElementById('user-email-display').textContent='—';
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('sc-auth').classList.add('active');
}
async function enterGuestMode(){
  guestMode=true;currentUser=null;
  document.getElementById('user-email-display').textContent='訪客模式（本機）';
  showLoading('載入中…');await loadAllData();hideLoading();go('home');
}

/* ── DB ── */
async function loadAllData(){
  if(guestMode){
    accounts=await idbAll('accounts');
    txs=await idbAll('transactions');
    txs.sort((a,b)=>b.date.localeCompare(a.date));
    const meta=await idbAll('meta');
    const tm=meta.find(m=>m.key==='globalTags');
    globalTags=tm?tm.value:[];
    // also collect tags from existing txs
    const tagSet=new Set(globalTags);txs.forEach(t=>(t.tags||[]).forEach(tg=>tagSet.add(tg)));globalTags=[...tagSet];
  } else {
    const[acRes,txRes]=await Promise.all([
      sb.from('accounts').select('*').order('created_at'),
      sb.from('transactions').select('*').order('date',{ascending:false})
    ]);
    accounts=acRes.data||[];txs=txRes.data||[];
    const tagSet=new Set();txs.forEach(t=>(t.tags||[]).forEach(tg=>tagSet.add(tg)));globalTags=[...tagSet];
  }
}

async function dbUpdateAccount(id,ch){

async function dbDeleteAccount(id){

async function dbAddTx(tx){

async function dbDeleteTx(id){

/* ⑤⑥ 正確週標籤 + y軸 */
function renderTrend(){
  const svg=document.getElementById('trend-svg');
  const W=svg.closest('.chart-box').offsetWidth||320,H=96;
  const now=new Date();let pts=[],lbls=[];
  const net=filter=>txs.filter(filter).reduce((a,t)=>t.type==='income'?a+Number(t.amount):a-Number(t.amount),0);
  if(curPeriod==='day'){
    for(let i=6;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i);const ds=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());pts.push(net(t=>t.date===ds));lbls.push((d.getMonth()+1)+'/'+d.getDate());}
    document.getElementById('period-hint').textContent='近 7 天淨收支';
  }else if(curPeriod==='week'){
    /* ⑤ 顯示實際日期範圍 */
    for(let i=7;i>=0;i--){
      const ws=new Date(now);ws.setDate(ws.getDate()-i*7);ws.setHours(0,0,0,0);
      const we=new Date(ws);we.setDate(we.getDate()+6);we.setHours(23,59,59,999);
      pts.push(net(t=>{const td=new Date(t.date+'T00:00:00');return td>=ws&&td<=we;}));
      lbls.push((ws.getMonth()+1)+'/'+(ws.getDate()));
    }
    document.getElementById('period-hint').textContent='近 8 週淨收支（每週起始日）';
  }else if(curPeriod==='month'){
    for(let i=5;i>=0;i--){const o=offM(now.getFullYear(),now.getMonth(),-i);pts.push(net(t=>t.date.startsWith(o.y+'-'+pad(o.m+1))));lbls.push(pad(o.m+1)+'月');}
    document.getElementById('period-hint').textContent='近 6 個月淨收支';
  }else{
    for(let i=3;i>=0;i--){const y=now.getFullYear()-i;pts.push(net(t=>t.date.startsWith(String(y))));lbls.push(String(y));}
    document.getElementById('period-hint').textContent='近 4 年淨收支';
  }

  const maxV=Math.max(...pts.map(Math.abs),1);
  const mid=H/2,step=(W-28)/(pts.length-1);
  const coords=pts.map((v,i)=>({x:14+i*step,y:mid-(v/maxV)*(mid-14),v}));

  /* ⑥ y軸刻度 */
  const ySteps=4;
  const yInc=maxV/ySteps;
  let yHtml='';
  for(let i=ySteps;i>=-ySteps;i--){
    if(i===0)continue;// skip zero — drawn as center line
    const val=yInc*i;
    yHtml+='<span>'+fmtY(val)+'</span>';
  }
  // build 5 labels: top, mid-top, zero, mid-bot, bot
  const yLabels=[maxV, maxV/2, 0, -maxV/2, -maxV];
  document.getElementById('chart-yaxis').innerHTML=yLabels.map(v=>'<span>'+fmtY(v)+'</span>').join('');

  let path='',area='';
  coords.forEach((p,i)=>{path+=(i?'L':'M')+p.x.toFixed(1)+','+p.y.toFixed(1);area+=(i?'L':'M')+p.x.toFixed(1)+','+p.y.toFixed(1);});
  area+=' L'+coords[coords.length-1].x.toFixed(1)+','+mid+' L'+coords[0].x.toFixed(1)+','+mid+' Z';
  let inner='<line x1="0" y1="'+mid+'" x2="'+W+'" y2="'+mid+'" stroke="rgba(128,128,128,.25)" stroke-width="1"/>'+
    '<path d="'+area+'" fill="rgba(29,158,117,.1)"/>'+
    '<path d="'+path+'" fill="none" stroke="#1D9E75" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  coords.forEach((p,i)=>{
    const c=p.v>=0?'#1D9E75':'#D85A30';
    inner+='<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="3.5" fill="'+c+'"/>';
    const anc=i===0?'start':i===coords.length-1?'end':'middle';
    inner+='<text x="'+p.x.toFixed(1)+'" y="'+(H-1)+'" text-anchor="'+anc+'" font-size="9" fill="rgba(128,128,128,.8)" font-family="inherit">'+lbls[i]+'</text>';
  });
  svg.innerHTML=inner;
}

function buildCalHTML(y,m){
  const today=new Date();const fd=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate(),dimp=new Date(y,m,0).getDate();
  const mk=y+'-'+pad(m+1);const bd={};
  txs.filter(t=>t.date.startsWith(mk)).forEach(t=>{if(!bd[t.date])bd[t.date]={i:0,e:0};if(t.type==='income')bd[t.date].i+=Number(t.amount);else bd[t.date].e+=Number(t.amount);});
  const tot=Math.ceil((fd+dim)/7)*7;
  let h='<div class="wdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="cgrid">';
  for(let i=0;i<tot;i++){
    let day,mo=m,yr=y,om=false;
    if(i<fd){day=dimp-fd+i+1;mo=m-1;yr=y;if(mo<0){mo=11;yr--;}om=true;}
    else if(i>=fd+dim){day=i-fd-dim+1;mo=m+1;yr=y;if(mo>11){mo=0;yr++;}om=true;}
    else day=i-fd+1;
    const ds=yr+'-'+pad(mo+1)+'-'+pad(day);
    const isTod=!om&&day===today.getDate()&&m===today.getMonth()&&y===today.getFullYear();
    const isSel=ds===selDate;const d=bd[ds];
    let dots='';if(d&&!om){if(d.e>0)dots+='<div class="dot e"></div>';if(d.i>0)dots+='<div class="dot i"></div>';}
    let amt='';if(d&&!om){const net=d.i-d.e;amt='<div class="damt" style="color:'+(net>=0?'var(--green-mid)':'var(--red-mid)')+'">'+(net>=0?'+':'')+fmtK(net)+'</div>';}
    h+='<div class="cc'+(om?' om':'')+(isTod&&!isSel?' td':'')+(isSel?' sel':'')+'" onclick="selDate2(\''+ds+'\')">';
    h+='<div class="dn">'+day+'</div><div class="ddots">'+dots+'</div>'+amt+'</div>';
  }
  return h+'</div>';
}

  const grp={};sorted.forEach(t=>{if(!grp[t.date])grp[t.date]=[];grp[t.date].push(t);});

    }
    items.forEach(t=>{
      const cat=t.type==='expense'?(cm[t.category]||{icon:'💰',name:'其他'}):(ci[t.category]||{icon:'💰',name:'其他'});

      const tags=(t.tags||[]);
      const tagHTML=tags.map(tg=>'<span class="tag-pill">#'+tg+'</span>').join('');
      h+='<div class="txi" onclick="confirmDelTx(\''+t.id+'\')">'+
        '<div class="txi-ic" style="background:'+(t.type==='income'?'var(--green-bg)':'var(--red-bg)')+'">'+cat.icon+'</div>'+
        '<div class="txi-info"><div class="txi-name">'+(t.note||cat.name)+'</div>'+

        '<div class="txi-amt '+(t.type==='income'?'i':'e')+'">'+(t.type==='income'?'+':'-')+fmt(Number(t.amount))+'</div></div>';
    });
  });
  panel.innerHTML=h;
}

function getAcctUsageRank(){
  const cnt={};txs.forEach(t=>{if(t.acct_id)cnt[t.acct_id]=(cnt[t.acct_id]||0)+1;});
  return accounts.slice().sort((a,b)=>(cnt[b.id]||0)-(cnt[a.id]||0));
}
/* ⑦ 分類依頻率排序 */
function getCatsSorted(type){
  const cats=type==='expense'?ECATS:ICATS;
  const cnt={};txs.filter(t=>t.type===type).forEach(t=>{cnt[t.category]=(cnt[t.category]||0)+1;});
  return cats.slice().sort((a,b)=>(cnt[b.id]||0)-(cnt[a.id]||0));
}

    if(v&&!addTags.includes(v)){addTags.push(v);renderTagChips();e.target.value='';}

    addTags.pop();renderTagChips();

});

function downloadFile(content,filename,mime){const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url);}
function exportCSV(){
  const cm=cmap('expense'),ci=cmap('income');
  const header='日期,類型,分類,備註,標籤,金額,帳戶\n';
  const rows=txs.map(t=>{
    const cat=t.type==='expense'?(cm[t.category]||{name:t.category}):(ci[t.category]||{name:t.category});
    const acct=accounts.find(a=>a.id===t.acct_id);
    const tags=(t.tags||[]).join(';');
    const amt=t.type==='income'?Number(t.amount):-Number(t.amount);
    return [t.date,t.type==='income'?'收入':'支出',cat.name,'"'+(t.note||'').replace(/"/g,'""')+'"',tags,amt,acct?acct.name:''].join(',');
  }).join('\n');
  const d=new Date();downloadFile('\uFEFF'+header+rows,'記帳本_'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'.csv','text/csv;charset=utf-8');toast('CSV 已匯出 ✓');
}

async function handleImport(e){
  const file=e.target.files[0];if(!file)return;
  try{const text=await file.text();const data=JSON.parse(text);if(!data.transactions&&!data.accounts){toast('格式不正確');return;}
  if(!confirm('匯入 '+(data.transactions?.length||0)+' 筆交易？'))return;
  showLoading('匯入中…');
  if(guestMode){
    if(data.accounts?.length)for(const a of data.accounts)await idbPut('accounts',a);
    if(data.transactions?.length)for(const t of data.transactions)await idbPut('transactions',t);
  } else {
    if(data.accounts?.length)for(const a of data.accounts)await sb.from('accounts').upsert({id:a.id,user_id:currentUser.id,type:a.type,name:a.name,balance:a.balance});
    if(data.transactions?.length)for(const t of data.transactions)await sb.from('transactions').upsert({id:t.id,user_id:currentUser.id,acct_id:t.acct_id||null,type:t.type,amount:t.amount,category:t.category,note:t.note||'',date:t.date,tags:t.tags||[]});
  }
  await loadAllData();hideLoading();toast('匯入完成 ✓');go('home');
  }catch(err){hideLoading();toast('匯入失敗:'+err.message);}
  e.target.value='';
}

  let list=[...txs];
  if(ledgerAcctFilter)list=list.filter(t=>t.acct_id===ledgerAcctFilter);
  if(ledgerTagFilter)list=list.filter(t=>(t.tags||[]).includes(ledgerTagFilter));
  if(q)list=list.filter(t=>(t.note||'').toLowerCase().includes(q)||(t.category||'').toLowerCase().includes(q));
  list.sort((a,b)=>b.date.localeCompare(a.date));
  const container=document.getElementById('ledger-list');
  if(!list.length){container.innerHTML='<div class="empty">尚無符合的交易<br>📋</div>';return;}
  const grp={};list.forEach(t=>{if(!grp[t.date])grp[t.date]=[];grp[t.date].push(t);});
  const cm=cmap('expense'),ci=cmap('income');
  let h='';
  Object.keys(grp).sort((a,b)=>b.localeCompare(a)).forEach(date=>{
    const items=grp[date];
    const de=items.filter(t=>t.type==='expense').reduce((a,t)=>a+Number(t.amount),0);
    const di=items.filter(t=>t.type==='income').reduce((a,t)=>a+Number(t.amount),0);
    const dt=new Date(date+'T00:00:00');
    const p2=[];if(di>0)p2.push('<span style="color:var(--green)">+'+fmt(di)+'</span>');if(de>0)p2.push('<span style="color:var(--red)">-'+fmt(de)+'</span>');
    h+='<div class="tx-dh"><span class="dl">'+(dt.getMonth()+1)+'/'+dt.getDate()+' 週'+'日一二三四五六'[dt.getDay()]+'</span><span class="ds">'+p2.join(' ')+'</span></div>';
    items.forEach(t=>{
      const cat=t.type==='expense'?(cm[t.category]||{icon:'💰',name:'其他'}):(ci[t.category]||{icon:'💰',name:'其他'});
      const acct=accounts.find(a=>a.id===t.acct_id);const atyp=acct?at(acct.type):null;
      const tags=t.tags||[];const tagHTML=tags.map(tg=>'<span class="tag-pill">#'+tg+'</span>').join('');
      h+='<div class="txi" onclick="openTxDetail(''+t.id+'')">'+
        '<div class="txi-ic" style="background:'+(t.type==='income'?'var(--green-bg)':'var(--red-bg)')+'">'+cat.icon+'</div>'+
        '<div class="txi-info"><div class="txi-name">'+(t.note||cat.name)+'</div>'+
        '<div class="txi-sub">'+cat.name+(acct?' · '+(atyp?atyp.icon:'')+' '+acct.name:'')+(tagHTML?' '+tagHTML:'')+'</div></div>'+
        '<div class="txi-amt '+(t.type==='income'?'i':'e')+'">'+(t.type==='income'?'+':'-')+fmt(Number(t.amount))+'</div></div>';
    });
  });
  container.innerHTML=h;
}

/* ── MANAGE TAGS ── */
function openManageTags(){
  const all=getAllTags();
  let h='<div class="modal-title">管理 Tags</div>';
  if(!all.length)h+='<div style="text-align:center;color:var(--text3);padding:16px;font-size:13px">尚無標籤</div>';
  all.forEach(tg=>{h+='<div class="tag-manage-item"><span style="font-size:14px"># '+tg+'</span><button class="tag-manage-del" onclick="deleteGlobalTag(''+tg+'')">×</button></div>';});
  h+='<div class="tag-add-row"><input type="text" id="new-tag-inp" placeholder="新標籤名稱"><button onclick="addGlobalTagFromInput()">新增</button></div>';
  showModal(h);
}
async function addGlobalTagFromInput(){
  const v=(document.getElementById('new-tag-inp')||{}).value?.trim();
  if(!v){toast('請輸入標籤名稱');return;}
  if(!globalTags.includes(v))globalTags.push(v);
  await saveGlobalTags();openManageTags();toast('已新增標籤');
}
async function deleteGlobalTag(tag){
  globalTags=globalTags.filter(t=>t!==tag);
  await saveGlobalTags();openManageTags();toast('已刪除標籤');
}

/* ── BOOT ── */
function hideSplash(){const s=document.getElementById('splash');if(s)s.style.display='none';}
(async()=>{
  try{
    await openIDB();
  }catch(e){
    hideSplash();
    document.getElementById('sc-auth').classList.add('active');
    return;
  }
  // Try Supabase session first
  try{
    const{data:{session}}=await sb.auth.getSession();
    if(session){currentUser=session.user;hideSplash();await onLogin();return;}
  }catch(e){}
  // Check for existing local (guest) data
  try{
    const saved=await idbAll('accounts');
    if(saved.length){hideSplash();await enterGuestMode();return;}
  }catch(e){}
  // Show auth screen
  hideSplash();
  document.getElementById('sc-auth').classList.add('active');
  try{sb.auth.onAuthStateChange(async(event,session)=>{if(event==='SIGNED_IN'&&session)currentUser=session.user;});}catch(e){}
})();
</script>
